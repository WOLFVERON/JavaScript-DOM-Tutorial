<style>
/* Layout: a ledger-style study desk. Sticky header with countdown, tab rail, one working view at a time. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --sunk:#e8eeea; --line:#d3ddd7; --fg:#15211c; --muted:#5b6b64;
  --accent:#0d6b55; --accent-soft:#d6ece4; --accent-fg:#ffffff;
  --good:#1f8a4c; --warn:#b26b00; --bad:#b3261e;
  --p1:#0d6b55; --p2:#2f5fb3; --p3:#8a4fbf; --p4:#c0562a; --p5:#b08900; --p6:#3b8c9c;
  --h0:#e3e9e5; --h1:#b9dccd; --h2:#7fbfa5; --h3:#3c9a78; --h4:#0d6b55;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2622; --line:#2a3833; --fg:#e4ece8; --muted:#93a59d;
  --accent:#4cc39c; --accent-soft:#183a30; --accent-fg:#06150f;
  --good:#5ccf8a; --warn:#e3a33b; --bad:#f07167;
  --p1:#4cc39c; --p2:#7aa5f0; --p3:#c193ec; --p4:#f08a5d; --p5:#e2c04a; --p6:#6cc6d6;
  --h0:#1c2622; --h1:#1d4436; --h2:#22684f; --h3:#2f9470; --h4:#4cc39c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2622; --line:#2a3833; --fg:#e4ece8; --muted:#93a59d;
  --accent:#4cc39c; --accent-soft:#183a30; --accent-fg:#06150f;
  --good:#5ccf8a; --warn:#e3a33b; --bad:#f07167;
  --p1:#4cc39c; --p2:#7aa5f0; --p3:#c193ec; --p4:#f08a5d; --p5:#e2c04a; --p6:#6cc6d6;
  --h0:#1c2622; --h1:#1d4436; --h2:#22684f; --h3:#2f9470; --h4:#4cc39c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.35rem}
.brand .tag{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:8px;font-family:var(--mono)}
.count b{font-size:1.5rem;color:var(--accent)}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--good)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a.on{color:var(--accent)}
main{padding-block:20px 60px}
section.view{display:grid;gap:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.card.hero{border-left:4px solid var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.paperline{display:grid;grid-template-columns:5.5rem 1fr 3.2rem;gap:10px;align-items:center}
.paperline .k{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--fg);border:1px solid var(--line)}
.chip.A{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{color:var(--warn)}
.chip.bad{color:var(--bad)}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
button,.btn{font:inherit;font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.danger{color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
textarea{width:100%;font-family:var(--mono);font-size:.8rem}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.c,th.c{text-align:center}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.conf{display:inline-flex;gap:3px}
.conf button{width:16px;height:16px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.conf button.on{background:var(--accent);border-color:var(--accent)}
.note{width:100%;font-size:.8rem}
.ch-name{min-width:220px}
.ch-name small{display:block;color:var(--muted);font-size:.75rem}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.list li.done span{color:var(--muted);text-decoration:line-through}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.quick .q{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.quick .q b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gantt{display:grid;gap:6px}
.grow{display:grid;grid-template-columns:9rem 1fr;gap:10px;align-items:center}
.gtrack{position:relative;height:26px;background:var(--sunk);border-radius:6px}
.gseg{position:absolute;top:0;bottom:0;border-radius:6px;display:flex;align-items:center;padding:0 6px;font-size:.7rem;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap}
.gnow{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.phase{border-left:3px solid var(--accent);padding-left:12px;display:grid;gap:4px}
.phase.cur{border-left-color:var(--bad)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.today{outline:1.5px solid var(--fg)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.prose{max-width:70ch;display:grid;gap:10px}
.prose ul{margin:0;padding-left:1.2rem;display:grid;gap:6px}
.prose p{margin:0}
details.pw{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 16px}
details.pw summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem}
details.pw[open] summary{margin-bottom:10px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--bad);border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
@media (max-width:560px){.paperline{grid-template-columns:4.5rem 1fr 2.8rem}.grow{grid-template-columns:5.5rem 1fr}.count b{font-size:1.25rem}}
html{overflow-x:hidden}
.notice{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
.notice.warn{border-color:var(--warn)}.notice.bad{border-color:var(--bad)}
.road{position:relative;height:18px;background:var(--sunk);border-radius:99px;overflow:visible}
.road .time{position:absolute;inset:0 auto 0 0;border-radius:99px;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px)}
.road .done{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.road .planm{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);opacity:.55}
.road .you{position:absolute;top:50%;width:22px;height:22px;margin-left:-11px;transform:translateY(-50%);border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.dots{display:grid;grid-template-columns:repeat(28,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:3px;background:var(--h0);display:block;max-width:100%}
.dots i.part{background:var(--h2)}.dots i.full{background:var(--h4)}.dots i.fut{opacity:.35}
.ms{display:grid;grid-template-columns:1fr 3.5rem;gap:4px 10px;align-items:center}
.lvl{display:inline-grid;place-items:center;min-width:2.2rem;height:2.2rem;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-family:var(--mono);font-weight:500}
main{touch-action:pan-y pinch-zoom;will-change:transform}
nav.tabs{position:relative}
#tabInk{position:absolute;bottom:0;left:0;height:2px;width:0;background:var(--accent);border-radius:2px;transition:transform .32s cubic-bezier(.2,.85,.25,1),width .32s cubic-bezier(.2,.85,.25,1);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function splitSession(a,b){const out={};let s=a;while(s<b){const d=new Date(s),nx=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime(),e=Math.min(b,nx);out[iso(d)]=(out[iso(d)]||0)+(e-s)/36e5;s=e}return out}
/* add (or set) hours for a paper on a day; a day never exceeds 24 hours. Returns true when capped. */
function addHours(day,p,h,mode){const l=Object.assign({},S.log[day]),cur=+l[p]||0,others=Object.entries(l).filter(([k])=>k!==p).reduce((a,[,v])=>a+(+v||0),0);
  const want=mode==="set"?h:cur+h;const v=Math.round(Math.max(0,Math.min(24-others,want))*100)/100;
  if(v>0)l[p]=v;else delete l[p];if(Object.keys(l).length)S.log[day]=l;else delete S.log[day];return v<want-1e-9}
function mmss(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}

function streak(){let n=0,d=new Date();if(hoursOn(iso(d))===0)d=addDays(d,-1);while(hoursOn(iso(d))>0){n++;d=addDays(d,-1)}return n}

function targetSum(from,to){let a=0;for(let d=new Date(from);d<=to;d=addDays(d,1))a+=dayTarget(d);return a}
function hoursStudied(){const a=S.settings.startDate,b=iso(addDays(parse(examStart()),-1));return Object.keys(S.log).filter(k=>k>=a&&k<=b).reduce((s,k)=>s+hoursOn(k),0)}

function expectedPct(plan){if(!plan.valid)return 0;const t=parse(todayISO());if(t<plan.start)return 0;if(t>=plan.exam)return 1;
  const base={1:[0,.55],2:[.55,.2],3:[.75,.15],4:[.9,.1]};
  for(const ph of plan.phases){if(t>=ph.start&&t<ph.end){const f=diffDays(ph.start,t)/Math.max(1,diffDays(ph.start,ph.end));const [b,w]=base[ph.key];return b+w*f}}return 0}

/* Timeline generator */
/* split `days` by weight, at least 1 day each; null when there are fewer days than items */
function allocate(days,ws){const n=ws.length;if(!n)return [];if(days<n)return null;const out=ws.map(()=>1);let left=days-n;
  if(left>0){const tw=ws.reduce((a,b)=>a+b,0),raw=ws.map(w=>left*w/tw),fl=raw.map(Math.floor);fl.forEach((x,i)=>out[i]+=x);let rem=left-fl.reduce((a,b)=>a+b,0);
    raw.map((x,i)=>[x-Math.floor(x),i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).forEach(([,i])=>{if(rem>0){out[i]++;rem--}})}return out}
function buildPlan(){
  const st=S.settings, start=parse(st.startDate), exam=parse(examStart()), D=diffDays(start,exam), ps=activePapers().map(p=>p.id);
  const plan={phases:[],start,exam,D:Math.max(D,1),valid:D>=1,issue:"",warn:""};
  if(D<1){plan.issue="Your plan start date is on or after your first paper. Choose a new start date in Setup, or update the exam schedule.";return plan}
  let cur=start;
  const split=(days,items)=>{const lens=allocate(days,items.map(x=>x.w));
    if(!lens)return [{papers:[...new Set(items.flatMap(x=>x.papers))],label:"All papers (rapid)",start:cur,end:addDays(cur,days)}];
    let c=cur;return items.map((it,i)=>{const b={papers:it.papers,label:it.label,start:c,end:addDays(c,lens[i])};c=b.end;return b})};
  const push=(key,name,days,desc,items)=>{if(days<=0)return;plan.phases.push({key,name,start:cur,end:addDays(cur,days),desc,blocks:split(days,items)});cur=addDays(cur,days)};
  let p4=Math.min(Math.max(21,Math.round(D*.12)),45); if(p4>D*.4)p4=Math.max(1,Math.round(D*.4));
  const R=D-p4;
  const [p1,p2,p3]=st.frDone?[0,...(allocate(R,[.58,.42])||[R,0])]:(allocate(R,[.6,.23,.17])||[0,R,0]);
  const g=st.groups, per=ps.map(id=>({papers:[id],w:paperOf(id).w,label:paperOf(id).short}));
  const firstBlocks = g==="1"?[{papers:["fr","audit"],w:1.4,label:"FR + Audit"},{papers:["afm","audit"],w:1,label:"AFM + Audit"}]
    : g==="2"?[{papers:["dt","ibs"],w:1.3,label:"DT + IBS cases"},{papers:["idt","ibs"],w:1,label:"IDT + IBS cases"}]
    : [{papers:["fr","audit"],w:1.3,label:"FR + Audit"},{papers:["dt","afm"],w:1.25,label:"DT + AFM"},{papers:["idt","ibs"],w:1,label:"IDT + IBS"}];
  push(1,"Phase 1 · Concepts & first reading",p1,"One numerical paper paired with one theory paper. Finish ICAI study material, make your own summary notes, solve illustrations and test-your-knowledge questions. Tick Read and Qs for each chapter.",firstBlocks);
  push(2,"Phase 2 · Revision 1 + question practice",p2,"Paper by paper. Revise from your notes, solve every past-paper question and RTP question for each chapter, and log weak chapters (confidence 1–2).",per);
  push(3,"Phase 3 · Revision 2 + mock cycle",p3,"Faster revision with full 3-hour papers. Write at least one full mock per paper per cycle under exam conditions, check against ICAI suggested answers, and fix presentation.",per);
  push(4,"Phase 4 · Final revision (exam mode)",p4,"Revision 3 from notes only. Amendments, MTP / RTP, formula sheets, and SA / section lists. Sleep and timing match the exam: 2 pm to 5 pm.",per);
  if(!st.frDone&&p1<60)plan.warn=`Only ${p1} days are left for first reading of ${ps.length} papers, which is very tight. If you've already read the syllabus once, tick "I've finished first reading" in Setup and the plan moves straight to revision.`;
  return plan;
}

const TOMB=store.get(LS+".tomb",{});
function saveTomb(){const ks=Object.keys(TOMB);if(ks.length>800)ks.sort((a,b)=>TOMB[a]-TOMB[b]).slice(0,ks.length-800).forEach(k=>delete TOMB[k]);store.set(LS+".tomb",TOMB)}
function makeRecords(o){
  const R={col:null,w:{}};
  const write=(id,fn)=>{R.w[id]=(R.w[id]||Promise.resolve()).then(fn).catch(()=>{})};
  R.saveLocal=()=>store.set(o.key,o.list().filter(e=>!TOMB[e.id]).slice(-(o.limit||100000)).map(o.toLocal));
  R.put=e=>{e.u=Date.now();const L=o.list(),i=L.findIndex(x=>x.id===e.id);if(i<0)L.push(e);else L[i]=e;if(TOMB[e.id]){delete TOMB[e.id];saveTomb()}R.saveLocal();
    if(R.col){const col=R.col;write(e.id,()=>o.write?o.write(col,e):col.doc(e.id).set(o.toDoc(e)))}};
  R.remove=id=>{o.setList(o.list().filter(x=>x.id!==id));TOMB[id]=Date.now();saveTomb();R.saveLocal();
    if(R.col){const col=R.col;write(id,()=>col.doc(id).set({deleted:true,u:Date.now()}))}};
  R.attach=col=>{R.col=col;let first=true;col.onSnapshot(qs=>{
    qs.docChanges().forEach(c=>{const d=c.doc.data()||{},id=c.doc.id,L=o.list(),i=L.findIndex(x=>x.id===id);
      if(c.type==="removed"||d.deleted){if(i>=0)L.splice(i,1);if(!TOMB[id]){TOMB[id]=+d.u||Date.now();saveTomb()}return}
      if(TOMB[id]&&(+d.u||0)<=TOMB[id])return;
      const r=o.fromDoc(d);if(!r||r.id!==id)return;if(TOMB[id]){delete TOMB[id];saveTomb()}
      if(i<0)L.push(r);else if((r.u||0)>(L[i].u||0))L[i]=r;});
    if(first){first=false;const remote=new Set(qs.docs.map(d=>d.id));o.list().filter(x=>!remote.has(x.id)&&!TOMB[x.id]).forEach(x=>write(x.id,()=>o.write?o.write(col,x):col.doc(x.id).set(o.toDoc(x))))}
    R.saveLocal();o.onChange();},()=>{})};
  return R}

- ${sol?"Use the ICAI suggested answers below as the marking scheme. Accept alternative correct approaches and reasonable stated assumptions, as ICAI examiners do.":"No suggested answers were provided: mark from your knowledge of ICAI study material and set confidence to medium or low."}
- Numerical questions: step marking. Give credit for correct working notes, formulae and intermediate figures. Apply carry-forward: do not penalise the same error twice.
- Theory and case questions: credit the correct provision (Ind AS / SA / section / rule / clause), its application to the facts, and a clear conclusion. A missing conclusion loses marks. Irrelevant or padded content earns nothing.
- Optional questions: if the student attempted more than required, mark the attempts in the order they appear and ignore the excess.
- Presentation: comment on legibility, numbering, working notes and headings.
- Be strict but fair. When unsure between two marks, give the lower one and say why. Mark only what is in the transcript; [illegible] text earns nothing. Do not invent answers.

QUESTION PAPER:
${qpT}

${sol?`ICAI SUGGESTED ANSWERS / MARKING SCHEME:\n${solT}\n\n`:""}STUDENT'S ANSWER SHEET (transcribed from handwriting):
${ansT}

Return ONLY JSON in this shape:
{"total":number,"max":${evForm.max},"summary":"2-3 sentences on overall performance","confidence":"high|medium|low","questions":[{"q":"1(a)","max":number,"awarded":number,"status":"full|partial|weak|not_attempted","credited":["what earned marks"],"missed":["what lost marks"],"feedback":"2-3 sentences","icai_tip":"how ICAI expects this answer to be written"}],"strengths":["..."],"improvements":["top 5 specific, actionable fixes"],"presentation":"1-2 sentences","time_management":"1 sentence, e.g. unattempted or rushed answers"}

function evReconcile(qs,formMax){qs.forEach(q=>{q.max=Math.max(0,+q.max||0);q.awarded=Math.max(0,+q.awarded||0);if(q.max>0&&q.awarded>q.max)q.awarded=q.max;q.awarded=Math.round(q.awarded*2)/2});
  const sum=qs.reduce((a,q)=>a+q.awarded,0),maxSum=qs.reduce((a,q)=>a+q.max,0);let note="";
  if(sum>formMax)note=`Question marks added up to ${sum}, more than the paper's ${formMax}, so the total is capped. Optional questions may have been marked twice.`;
  else if(maxSum>0&&maxSum<formMax-0.01)note=`The questions found carry ${maxSum} marks, less than the paper's ${formMax}. Part of the question paper may be missing from the upload.`;
  return {total:Math.round(Math.min(formMax,sum)*2)/2,note,maxSum}}

V.plan=()=>{
  const plan=buildPlan(), total=plan.D, t=new Date(), nowPct=Math.min(100,Math.max(0,diffDays(plan.start,t)/total*100));

  plan.phases.forEach(ph=>{rows.push(`<div class="grow"><span class="small" style="font-weight:600">${esc(ph.name.split(" · ")[0])}</span><div class="gtrack">${ph.blocks.map(b=>{const l=diffDays(plan.start,b.start)/total*100,w=diffDays(b.start,b.end)/total*100;return `<div class="gseg" title="${esc(b.label)}: ${fmtShort(b.start)} to ${fmtShort(addDays(b.end,-1))}" style="left:${l}%;width:${w}%;background:${col(b.papers[0])}">${esc(b.label)}</div>`}).join("")}<div class="gnow" style="left:${nowPct}%"></div></div></div>`)});
  const E=plan.exam, ms=[
    [addDays(E,-100),"Exam notification and form window usually opens around here. Fill the form early and check articleship, AICITSS and SPOM eligibility."],
    [addDays(E,-75),"RTP (Revision Test Papers) usually released. Solve every question, with amendments."],
    [addDays(E,-60),"MTP Series I usually released. Attempt each paper as a full 3-hour test."],
    [addDays(E,-35),"MTP Series II usually released. Second full mock round."],
    [addDays(E,-21),"Final revision starts. No new topics from here."],
    [addDays(E,-14),"Admit card usually available. Download it and check your photo, signature and centre."],
  ];
  const ad=activeDates();ad.forEach((x,i)=>{const gap=i?diffDays(parse(ad[i-1].date),parse(x.date)):null;ms.push([parse(x.date),`<b>${esc(x.p.short)} exam</b>${gap!=null?` · ${gap-1} revision day${gap-1===1?"":"s"} before it`:" · first paper"}`])});
  if(!plan.valid)return `<h2>Your timeline</h2><div class="card hero"><p style="margin:0">${esc(plan.issue)}</p><div class="row"><a class="btn" href="#setup" style="text-decoration:none">Open Setup</a></div></div>`;
  return `
  ${plan.warn?`<div class="notice warn"><span>${esc(plan.warn)}</span></div>`:""}
  <div class="row between"><h2>Your timeline</h2><span class="small muted num">${fmt(S.settings.startDate)} to ${fmt(examStart())} · ${total} days of prep</span></div>
  ${(()=>{const H=Math.round(targetSum(plan.start,addDays(plan.exam,-1)));return `<div class="card hero"><div class="row" style="gap:24px"><div class="stat"><span class="label">Total plan hours (from ${fmtShort(plan.start)})</span><b>${H} h</b></div><div class="stat"><span class="label">Studied so far</span><b>${hoursStudied().toFixed(1)} h</b></div><div class="stat"><span class="label">Hours left</span><b>${Math.round(hoursLeft())} h</b></div><div class="stat"><span class="label">Weekday / weekend</span><b>${S.settings.tWd} / ${S.settings.tWe} h</b></div></div>${H<1000?`<p class="small" style="margin:0"><span class="chip warn">Tight</span> Most rankers put in roughly 1,200–1,800 hours for both groups. Add hours on holidays and in the final 6 weeks (study leave), or move your attempt, to close the gap.</p>`:`<p class="small muted" style="margin:0">That's a solid budget. Protect it.</p>`}<p class="small muted" style="margin:0">Total counts every day from your plan start to the day before your first paper. Hours left is the total minus every hour you've logged since the plan start, so it only drops when you study.</p></div>`})()}
  <div class="card"><div class="gantt">${rows.join("")}</div><div class="legend">${activePapers().map(p=>`<span><span class="swatch" style="background:${col(p.id)}"></span>${p.short}</span>`).join("")}<span><span class="swatch" style="background:var(--bad)"></span>Today</span></div></div>
  <div class="grid g2">
    <div class="card"><div class="label">Phases</div>
      ${plan.phases.map(ph=>{const isCur=t>=ph.start&&t<ph.end;return `<div class="phase ${isCur?"cur":""}"><h3>${esc(ph.name)} ${isCur?'<span class="chip bad">now</span>':""}</h3><span class="num small muted">${fmtShort(ph.start)} to ${fmtShort(addDays(ph.end,-1))} · ${diffDays(ph.start,ph.end)} days</span><p class="small" style="margin:0">${esc(ph.desc)}</p><div class="row small">${ph.blocks.map(b=>`<span class="chip"><span class="swatch" style="background:${col(b.papers[0])}"></span>${esc(b.label)} · ${diffDays(b.start,b.end)}d · ${Math.round(targetSum(b.start,addDays(b.end,-1)))}h</span>`).join("")}</div></div>`}).join("")||`<p class="muted">Set a start date before your exam date in Setup.</p>`}
    </div>
    <div class="card"><div class="label">Key milestones (estimated)</div>
      <div class="tablewrap"><table>${ms.map(([d,txt])=>`<tr><td class="num small" style="white-space:nowrap">${fmtShort(d)}</td><td class="small">${txt} ${d<t?'<span class="chip">past</span>':""}</td></tr>`).join("")}</table></div>

let mockForm={paper:"fr"}, mockEdit=null;
V.mocks=()=>{
  const ps=activePapers(), tp=+S.settings.targetPct||75;
  const stats=ps.map(p=>{const m=S.mocks.filter(x=>x.paper===p.id).sort((a,b)=>a.date<b.date?-1:1);const pct=m.map(x=>x.score/x.max*100);return {p,m,avg:pct.length?pct.reduce((a,b)=>a+b,0)/pct.length:null,best:pct.length?Math.max(...pct):null,last:pct.length?pct[pct.length-1]:null}});
  const W=640,H=220,pad=32; const all=[...S.mocks].sort((a,b)=>a.date<b.date?-1:1);
  let chart=`<p class="muted small" style="margin:0">Add a mock score to see your trend against the target line.</p>`;
  if(all.length){const d0=parse(all[0].date),d1=parse(all[all.length-1].date),span=Math.max(1,diffDays(d0,d1));const x=d=>pad+diffDays(d0,parse(d))/span*(W-pad*2),y=v=>H-pad-(v/100)*(H-pad*1.6);
    chart=`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Mock score trend">
      ${[0,40,60,80,100].map(v=>`<line x1="${pad}" x2="${W-pad/2}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
      <line x1="${pad}" x2="${W-pad/2}" y1="${y(tp)}" y2="${y(tp)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-pad/2}" y="${y(tp)-5}" text-anchor="end" style="fill:var(--bad)">target ${tp}%</text>
      ${stats.map(s=>{if(!s.m.length)return"";const pts=s.m.map(m=>`${x(m.date)},${y(m.score/m.max*100)}`).join(" ");return `<polyline points="${pts}" fill="none" stroke="${col(s.p.id)}" stroke-width="2"/>${s.m.map(m=>`<circle cx="${x(m.date)}" cy="${y(m.score/m.max*100)}" r="3.5" fill="${col(s.p.id)}"/>`).join("")}`}).join("")}
      <text x="${pad}" y="${H-8}">${fmtShort(d0)}</text><text x="${W-pad/2}" y="${H-8}" text-anchor="end">${fmtShort(d1)}</text>
    </svg></div><div class="legend">${ps.map(p=>`<span><span class="swatch" style="background:${col(p.id)}"></span>${p.short}</span>`).join("")}</div>`}
  const grp=g=>{const s=stats.filter(x=>x.p.group===g&&x.last!=null);if(!s.length)return null;const tot=s.reduce((a,b)=>a+b.last,0);return {n:s.length,agg:tot/s.length,min:Math.min(...s.map(x=>x.last))}};
  const groupCard=g=>{const r=grp(g);if(!r)return"";const pass=r.min>=40&&r.agg>=50;return `<div class="stat"><span class="label">Group ${g===1?"I":"II"} (latest)</span><b>${r.agg.toFixed(1)}%</b><span class="small ${pass?"":"muted"}" style="color:${pass?"var(--good)":"var(--bad)"}">${pass?"Pass pace":"Below pass rule"} · lowest ${r.min.toFixed(0)}</span></div>`};
  return `
  <div class="row between"><h2>Mock tests</h2><div class="row"><span class="small muted">Target for a rank: ${tp}%+ in every paper</span><a class="btn" href="#evaluate" style="text-decoration:none">Have Claude mark an answer sheet</a></div></div>
  <div class="grid g2">
    <div class="card"><div class="label">Trend</div>${chart}</div>
    ${(()=>{const me=mockEdit&&S.mocks.find(m=>m.id===mockEdit),sel=me?me.paper:mockForm.paper;return `<div class="card"><div class="label">${me?"Edit score":"Add a score"}</div>
      <form id="mockForm" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
        <label class="f">Paper<select id="mPaper">${PAPERS.filter(p=>ps.includes(p)||p.id===sel).map(p=>`<option value="${p.id}" ${sel===p.id?"selected":""}>${p.short}</option>`).join("")}</select></label>
        <label class="f">Date<input type="date" id="mDate" value="${me?me.date:todayISO()}" max="${todayISO()}" required></label>
        <label class="f">Marks<input type="number" id="mScore" min="0" step="0.5" placeholder="62" value="${me?me.score:""}" required></label>
        <label class="f">Out of<input type="number" id="mMax" value="${me?me.max:100}" min="1" step="0.5" required></label>
        <label class="f" style="grid-column:1/-1">Source<input id="mSrc" placeholder="ICAI MTP Series I, coaching test series, PYQ May 2025…" value="${me?esc(me.src||""):""}"></label>
        <button class="primary" style="grid-column:1/-1">${me?"Update score":"Save score"}</button>
        ${me?`<button type="button" style="grid-column:1/-1" data-act="mockcancel">Cancel editing</button>`:""}
      </form>`})()}
      <div class="row" style="gap:24px">${groupCard(1)}${groupCard(2)}</div>
      <p class="small muted" style="margin:0">ICAI pass rule: at least 40 in each paper and 50% aggregate per group. 60+ in a paper earns an exemption. Group figures use each paper's latest mock.</p>

  <div class="tablewrap"><table><tr><th>Paper</th><th class="c">Mocks</th><th class="c">Average (all)</th><th class="c">Best</th><th class="c">Latest</th><th class="c">Gap to target</th></tr>
    ${stats.map(s=>`<tr><td><span class="row" style="gap:6px"><span class="swatch" style="background:${col(s.p.id)}"></span>${s.p.short}</span></td><td class="c num">${s.m.length}</td><td class="c num">${s.avg==null?"–":s.avg.toFixed(1)}</td><td class="c num">${s.best==null?"–":s.best.toFixed(1)}</td><td class="c num">${s.last==null?"–":s.last.toFixed(1)}</td><td class="c num" style="color:${s.last==null?"inherit":s.last>=tp?"var(--good)":"var(--warn)"}">${s.last==null?"–":(s.last>=tp?"on target":"−"+(tp-s.last).toFixed(1))}</td></tr>`).join("")}
  </table></div>
  ${S.mocks.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Paper</th><th class="c">Score</th><th>Source</th><th></th></tr>${[...S.mocks].sort((a,b)=>a.date<b.date?1:-1).map(m=>`<tr><td class="num small">${fmt(m.date)}</td><td>${paperOf(m.paper).short}</td><td class="c num">${m.score}/${m.max}</td><td class="small">${esc(m.src||"")}</td><td><button class="ghost" data-act="editmock" data-id="${m.id}">Edit</button><button class="ghost" data-act="delmock" data-id="${m.id}" aria-label="Delete mock">×</button></td></tr>`).join("")}</table></div>`:""}`;
};

V.hours=()=>{
  const weeks=18, t=new Date(), end=addDays(t,6-((t.getDay()+6)%7)), start=addDays(end,-weeks*7+1);
  let cells="";for(let i=0;i<weeks*7;i++){const d=addDays(start,i),k=iso(d),h=hoursOn(k);const tg=dayTarget(d)||1,r=h/tg;const l=h===0?"":r<.5?"l1":r<.75?"l2":r<1?"l3":"l4";cells+=`<i class="${l} ${k===todayISO()?"today":""}" title="${fmtShort(d)}: ${h.toFixed(1)} h" style="${d>t?"opacity:.35":""}"></i>`}
  const sum=(from,to)=>{let a=0;for(let d=new Date(from);d<=to;d=addDays(d,1))a+=hoursOn(iso(d));return a};
  const wk=sum(addDays(t,-6),t), mo=sum(addDays(t,-29),t), all=Object.keys(S.log).reduce((a,k)=>a+hoursOn(k),0);
  const per=activePapers().map(p=>({p,h:Object.values(S.log).reduce((a,l)=>a+(+l[p.id]||0),0)})), mx=Math.max(1,...per.map(x=>x.h));
  const t7=targetSum(addDays(t,-6),t);
  return `
  <h2>Study hours</h2>
  <div class="grid g3">
    <div class="card"><div class="stat"><span class="label">Last 7 days</span><b>${wk.toFixed(1)} h</b><span class="small muted">target ${t7} h · ${hitDays(7)} of 7 days on target</span></div><div class="bar"><i style="width:${Math.min(100,wk/t7*100)}%"></i></div></div>
    <div class="card"><div class="stat"><span class="label">Last 30 days</span><b>${mo.toFixed(1)} h</b><span class="small muted">${(mo/30).toFixed(1)} h per day</span></div></div>
    <div class="card"><div class="stat"><span class="label">All time</span><b>${all.toFixed(0)} h</b><span class="small muted">streak ${streak()} days</span></div></div>
  </div>
  <div class="card"><div class="row between"><div class="label">Last ${weeks} weeks · share of each day's target</div><div class="legend small"><span><i class="swatch" style="background:var(--h1)"></i>&lt;50%</span><span><i class="swatch" style="background:var(--h2)"></i>50–75%</span><span><i class="swatch" style="background:var(--h3)"></i>75–99%</span><span><i class="swatch" style="background:var(--h4)"></i>target hit</span></div></div><div class="heat">${cells}</div></div>
  <div class="grid g2">
    <div class="card"><div class="label">Hours by paper</div>${per.map(x=>`<div class="paperline"><span class="k">${x.p.short}</span><div class="bar"><i style="width:${x.h/mx*100}%;background:${col(x.p.id)}"></i></div><span class="num small">${x.h.toFixed(0)}h</span></div>`).join("")}</div>
    <div class="card"><div class="label">Log a past day</div>
      <form id="logForm" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
        <label class="f">Date<input type="date" id="lDate" value="${iso(addDays(t,-1))}" max="${todayISO()}"></label>
        <label class="f">Paper<select id="lPaper">${activePapers().map(p=>`<option value="${p.id}">${p.short}</option>`).join("")}</select></label>
        <label class="f">Hours<input type="number" id="lHrs" step="0.25" min="0" max="24" placeholder="3" required></label>
        <label class="f">How<select id="lMode"><option value="add">Add to that day</option><option value="set">Replace that paper's total</option></select></label>
        <button class="primary" style="grid-column:1/-1">Save hours</button>
      </form>
      <p class="small muted" style="margin:0">To clear a mistake, choose "Replace" and enter 0. A day can't go over 24 hours.</p>

V.playbook=()=>`
  <h2>AIR playbook</h2>
  <div class="grid g3">
    <div class="card"><div class="label">What a rank takes</div><div class="stat"><b>500+/600</b><span class="small muted">Recent AIR 1 totals have been roughly 83–86%.</span></div><p class="small" style="margin:0">Top-50 ranks usually need 70%+ aggregate in both groups together, in a single attempt. Check the current merit list on icai.org.</p></div>
    <div class="card"><div class="label">Per-paper target</div><div class="stat"><b>75–85</b><span class="small muted">FR, AFM and DT are where rankers build a lead</span></div><p class="small" style="margin:0">Audit and IDT theory reward exact ICAI wording. IBS rewards structure. A single paper under 65 makes a top rank hard.</p></div>
    <div class="card"><div class="label">Exam maths</div><div class="stat"><b>1.8 min</b><span class="small muted">per mark: 180 minutes for 100 marks</span></div><p class="small" style="margin:0">Budget about 1.6 minutes a mark so you keep 15 minutes for review. Never leave an attempted question without a conclusion.</p></div>
  </div>
  <details class="pw" open><summary>The non-negotiables</summary><div class="prose"><ul>
    <li><b>ICAI material is the syllabus.</b> Study material, RTPs, MTPs, past papers with suggested answers, and the case-scenario booklets. Coaching notes are a supplement.</li>
    <li><b>Three revisions minimum</b> before the exam. The third is from your own condensed notes and takes 2–3 days per paper.</li>
    <li><b>Write full papers.</b> At least 2–3 full 3-hour mocks per paper, written by hand at 2 pm, then self-checked strictly against ICAI answers.</li>
    <li><b>Amendments decide marks</b> in DT and IDT. Know which Finance Act and notifications apply to your attempt. DT: check whether your attempt is examined under the Income-tax Act, 1961 or the new Income-tax Act, 2025 (in force from 1 April 2026), using ICAI's applicability announcement.</li>
    <li><b>Spaced recall.</b> Revisit every chapter within 21 days of last touching it. The Today tab surfaces anything overdue.</li>
    <li><b>Protect sleep and health.</b> 7 hours of sleep. Rankers keep a steady 9–11 hours a day for months; they don't do 16-hour bursts followed by burnout.</li>
  </ul></div></details>
  <details class="pw"><summary>FR · Financial Reporting</summary><div class="prose"><ul>
    <li>Answer as an examiner reads it: state the relevant Ind AS and paragraph principle, apply it to the facts, then conclude with the journal entry or numbers.</li>
    <li>Consolidation, Ind AS 103, 109, 115 and 116 carry most of the marks. Do every RTP, MTP and PYQ question on these at least twice.</li>
    <li>Keep a “trap list”: contingent consideration, NCI measurement choice, modification accounting, ECL staging.</li>
    <li>Working notes must be numbered and referenced. Presentation marks are real.</li>
  </ul></div></details>
  <details class="pw"><summary>AFM · Advanced Financial Management</summary><div class="prose"><ul>
    <li>Make a one-page formula sheet per chapter and read it daily in the final month.</li>
    <li>Derivatives, Forex and Portfolio are the most frequent: solve every ICAI question.</li>
    <li>Write assumptions explicitly, round consistently, and finish with an advisory line (“the company should hedge using…”).</li>
    <li>Theory questions (startup finance, financial policy) are short and quick to score. Don't skip them.</li>
  </ul></div></details>
  <details class="pw"><summary>Audit · Advanced Auditing & Professional Ethics</summary><div class="prose"><ul>
    <li>Use the 4-step format: provisions (SA number and requirement), facts, analysis, conclusion.</li>
    <li>Memorise SA numbers with titles and key paragraphs. Make an SA one-pager.</li>
    <li>For ethics, quote the exact clause of Schedule I or II to the CA Act, and state whether the member is guilty.</li>
    <li>Use ICAI keywords. Practise writing, because reading alone feels like knowing.</li>
  </ul></div></details>
  <details class="pw"><summary>DT · Direct Tax & International Taxation</summary><div class="prose"><ul>
    <li>Quote section numbers where possible, as they lift theory and computational marks.</li>
    <li>PGBP, capital gains, TDS, business entities and transfer pricing need the most practice.</li>
    <li>International tax is largely theory plus treaty interpretation, and it scores well with structured answers.</li>
    <li>Keep a rates and thresholds sheet updated for your applicable Finance Act.</li>
  </ul></div></details>
  <details class="pw"><summary>IDT · GST, Customs & FTP</summary><div class="prose"><ul>
    <li>The exemption list, ITC rules and place of supply are high-yield. Revise them every week.</li>
    <li>Write computations in tabular form with a note per item: “Taxable / Exempt, reason”.</li>
    <li>Customs valuation and FTP are compact and score well. Don't leave them for the end.</li>
  </ul></div></details>
  <details class="pw"><summary>IBS · Integrated Business Solutions</summary><div class="prose"><ul>
    <li>IBS is a multidisciplinary case study paper, currently open book. Confirm the current rules for your attempt. Open book still punishes slow searching, so tab your material.</li>
    <li>Solve every ICAI case study timed. Read the requirements first, then the case.</li>
    <li>It pulls from FR, AFM, Audit, DT, IDT and SPOM Sets A and B, so your other papers' revision feeds it.</li>
    <li>Write in a decision-oriented, report style: issue, analysis, recommendation.</li>
  </ul></div></details>
  <details class="pw"><summary>A ranker's study day (template)</summary><div class="prose"><ul>
    <li><b>06:30–09:30</b> Numerical paper, deep work (FR, AFM or DT)</li>
    <li><b>09:45–12:45</b> Theory paper (Audit, IDT or law-heavy chapters)</li>
    <li><b>14:00–17:00</b> Questions and answer writing. This matches the real exam slot.</li>
    <li><b>17:30–19:30</b> Second paper continued, or a mock</li>
    <li><b>21:00–22:00</b> Revise today's notes plus anything overdue from the Today tab. Plan tomorrow's tasks.</li>

const BK_FORMAT="ca-final-rank-desk";

function makeBackup(withTr){return {format:BK_FORMAT,version:2,created:new Date().toISOString(),state:S,journal:J,
  evals:EV.map(e=>{const c=Object.assign({},e);if(!withTr)delete c.transcript;return c})}}
function readBackup(txt){let o;try{o=JSON.parse(String(txt||"").trim())}catch(e){throw new Error("That isn't backup text. Use the whole file or the whole copied text, starting with {")}
  let state,journal=[],evals=[];
  if(o&&o.format===BK_FORMAT){if(+o.version>2)throw new Error("This backup comes from a newer version of the app.");state=o.state;journal=o.journal||[];evals=o.evals||[]}
  else if(isObj(o)&&isObj(o.settings)){state=Object.assign({},o);journal=Array.isArray(o.journal)?o.journal:[];delete state.journal}
  else throw new Error("This doesn't look like a Rank Desk backup.");
  if(!isObj(state)||!isObj(state.settings))throw new Error("The backup is missing its settings, so it can't be restored.");
  for(const k of ["ch","log","checks","todos"])if(state[k]!=null&&!isObj(state[k]))throw new Error("Part of the backup ("+k+") is damaged.");
  if(state.mocks!=null&&!Array.isArray(state.mocks))throw new Error("The mock list in the backup is damaged.");
  if(!Array.isArray(journal)||!Array.isArray(evals))throw new Error("The tough topics or evaluations in the backup are damaged.");
  state.mocks=(state.mocks||[]).filter(m=>m&&m.id&&CH[m.paper]&&isFinite(+m.score)&&+m.max>0);
  return {state:load(state),journal:journal.filter(validJ).map(migJ),evals:evals.filter(e=>e&&typeof e.id==="string"&&e.result&&Array.isArray(e.result.questions)),created:o.created||null}}
function backupCounts(b){return {chapters:Object.values(b.state.ch).filter(c=>c&&c.r).length,days:Object.keys(b.state.log).length,mocks:b.state.mocks.length,topics:b.journal.length,evals:b.evals.length}}
function takeRestorePoint(reason){return store.set(LS+".restorePoint",{at:Date.now(),reason,b:makeBackup(false)})}
function applyBackup(b,reason){takeRestorePoint(reason);
  S=b.state;S.updatedAt=Date.now();
  const jk=new Set(b.journal.map(e=>e.id));J.slice().forEach(e=>{if(!jk.has(e.id))jRemove(e.id)});b.journal.forEach(e=>{if(TOMB[e.id]){delete TOMB[e.id];saveTomb()}jPut(Object.assign({},e))});
  const ek=new Set(b.evals.map(e=>e.id));EV.slice().forEach(e=>{if(!ek.has(e.id))evRemove(e.id)});b.evals.forEach(e=>{if(TOMB[e.id]){delete TOMB[e.id];saveTomb()}evPut(Object.assign({},e))});
  save();render()}
const RESET_PARTS=[["progress","Syllabus progress, revision history and chapter notes"],["hours","Study hours (and a running timer)"],["mocks","Mock scores"],["evals","Evaluations"],["journal","Tough topics and their review history"],["tasks","Daily tasks"],["checks","Checklists"],["settings","Settings: hours, targets, squad sharing (exam dates and plan start are kept)"]];
function applyReset(parts){takeRestorePoint("Before erasing: "+parts.map(k=>RESET_PARTS.find(x=>x[0]===k)[1].split(/[,:(]/)[0].trim().toLowerCase()).join(", "));
  if(parts.includes("progress"))S.ch={};
  if(parts.includes("hours")){S.log={};timer=null;store.del(TK)}
  if(parts.includes("mocks")){S.mocks=[];mockEdit=null}
  if(parts.includes("tasks"))S.todos={};
  if(parts.includes("checks"))S.checks={};
  if(parts.includes("settings")){const keep={examDates:S.settings.examDates,startDate:S.settings.startDate};S.settings=Object.assign(freshState().settings,keep)}
  if(parts.includes("journal"))J.slice().forEach(e=>jRemove(e.id));
  if(parts.includes("evals"))EV.slice().forEach(e=>evRemove(e.id));
  save();if(parts.includes("settings"))pushBoard();render()}

async function bkClick(b){const a=b.dataset.act;
  if(a==="bkcopy"){const txt=JSON.stringify(makeBackup(bk.withTr));const ta=document.getElementById("bkText");

  if(a==="undoask"){bk.undoAsk=true;render();return true}

  if(a==="rsask"){bk.resetAsk=true;render();return true}

  if(a==="rsyes"){const parts=RESET_PARTS.map(x=>x[0]).filter(k=>bk.reset[k]);applyReset(parts);bk.reset={};bk.resetAsk=false;render();toast("Erased. Undo is available in Setup.");return true}

function bkChange(b){const a=b.dataset.act;

/* swipe: content follows your finger, then flies out and the next section slides in */
function isField(el){return !!(el&&el.closest&&el.closest("input,textarea,select"))}
function scrollerOf(el){for(;el&&el!==document.body;el=el.parentElement){const ox=getComputedStyle(el).overflowX;if((ox==="auto"||ox==="scroll")&&el.scrollWidth>el.clientWidth+2)return el}return null}
let sw=null;
document.addEventListener("touchstart",e=>{if(swiping||e.touches.length!==1||isField(e.target)){sw=null;return}const t=e.touches[0];sw={x:t.clientX,y:t.clientY,t:Date.now(),lock:null,dx:0,lx:t.clientX,lt:Date.now(),v:0,sc:scrollerOf(e.target)}},{passive:true});
document.addEventListener("touchmove",e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=t.clientY-sw.y;
  if(!sw.lock){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;sw.lock=Math.abs(dx)>Math.abs(dy)*1.3?"x":"y";if(sw.lock==="x"&&sw.sc){const c=sw.sc,can=dx<0?c.scrollLeft+c.clientWidth<c.scrollWidth-2:c.scrollLeft>2;if(can){sw=null;return}}if(sw.lock==="x"){const m=document.getElementById("main");m.style.transition="none"}}
  if(sw.lock!=="x")return;const now=Date.now();sw.v=(t.clientX-sw.lx)/Math.max(1,now-sw.lt);sw.lx=t.clientX;sw.lt=now;
  const o=ORDER(),i=o.indexOf(view),edge=(dx>0&&i===0)||(dx<0&&i===o.length-1);sw.dx=dx;
  if(RM())return;const w=window.innerWidth,x=edge?dx*.25:dx;const m=document.getElementById("main");
  m.style.transform=`translateX(${x}px)`;m.style.opacity=String(1-Math.min(.5,Math.abs(x)/w*.6))},{passive:true});
function settle(){const m=document.getElementById("main");m.style.transition="transform .3s cubic-bezier(.2,1.25,.4,1), opacity .2s";m.style.transform="translateX(0)";m.style.opacity="1";setTimeout(()=>{m.style.transition="";m.style.transform="";m.style.opacity=""},320)}
document.addEventListener("touchend",e=>{if(!sw)return;const s0=sw;sw=null;if(s0.lock!=="x")return;
  const t=e.changedTouches[0],dx=t.clientX-s0.x,o=ORDER(),i=o.indexOf(view),dir=dx<0?1:-1,n=i+dir,w=window.innerWidth;
  const fling=Math.abs(s0.v)>.45&&Math.sign(s0.v)===Math.sign(dx);
  if(n<0||n>=o.length||!(Math.abs(dx)>w*.22||(fling&&Math.abs(dx)>40))||(window.getSelection&&String(window.getSelection()).length)){if(!RM())settle();return}
  if(RM()){location.hash=o[n];window.scrollTo(0,0);return}
  swiping=true;const m=document.getElementById("main");const ms=Math.max(110,Math.min(200,(w-Math.abs(dx))/Math.max(.8,Math.abs(s0.v)||.8)));
  m.style.transition=`transform ${ms}ms cubic-bezier(.4,0,.9,.6), opacity ${ms}ms`;m.style.transform=`translateX(${-dir*w*.7}px)`;m.style.opacity="0";
  setTimeout(()=>{location.hash=o[n];route();window.scrollTo(0,0);swiping=false;enter(dir,w*.35)},ms)},{passive:true});
document.addEventListener("touchcancel",()=>{if(sw&&sw.lock==="x"&&!RM())settle();sw=null},{passive:true});
function swipeHint(){if(!("ontouchstart" in window)||store.get(LS+".swipeHint",null))return;store.set(LS+".swipeHint",1);setTimeout(()=>toast("Tip: swipe left or right to switch sections"),900)}
window.addEventListener("hashchange",route);
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}
function touch(k,what){const c=Object.assign({},S.ch[k]);c.last=todayISO();c.hist=(Array.isArray(c.hist)?c.hist:[]).concat([{d:todayISO(),s:what||"rev"}]).slice(-40);S.ch[k]=c}
const ORDERED=["r","r1","r2","r3"];
function setStage(k,st,on){const c=Object.assign({},S.ch[k]);let cleared=[];
  if(on){(ORDERED.includes(st)?ORDERED.slice(0,ORDERED.indexOf(st)+1):[st]).forEach(x=>c[x]=true);S.ch[k]=c;touch(k,st)}
  else{c[st]=false;if(ORDERED.includes(st))ORDERED.slice(ORDERED.indexOf(st)+1).forEach(x=>{if(c[x]){c[x]=false;cleared.push(x)}});S.ch[k]=c}
  return cleared}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(b){const a=b.dataset.act;
    if(jClick(b))return;
    if(a==="rankby"){S.settings.rankBy=b.dataset.k;save();render();return}
    if(evClick(b))return;
    if(/^(bk|undo|rs)/.test(a)){bkClick(b);return}
    if(a==="hr"){const capped=addHours(todayISO(),b.dataset.p,+b.dataset.d);save();render();if(capped&&+b.dataset.d>0)toast("A day can't have more than 24 hours");return}
    if(a==="deltodo"){S.todos[todayISO()].splice(+b.dataset.i,1);save();render();return}
    if(a==="touch"){touch(b.dataset.k);save();render();toast("Marked as revised today");return}
    if(a==="paper"){curPaper=b.dataset.p;render();return}
    if(a==="filter"){chFilter=b.dataset.f;render();return}
    if(a==="conf"){const k=b.dataset.k,n=+b.dataset.n;S.ch[k]=Object.assign({},S.ch[k]);S.ch[k].conf=S.ch[k].conf===n?0:n;save();render();return}
    if(a==="tstart"){timer={p:document.getElementById("tPaper").value,start:Date.now()};store.set(TK,timer);render();return}
    if(a==="tcancel"){timer=null;store.del(TK);render();toast("Timer discarded");return}
    if(a==="tstop"){if(!timer)return;const now=Date.now(),cap=12*36e5,capped=now-timer.start>cap,end=capped?timer.start+cap:now,parts=splitSession(timer.start,end),tot=Object.values(parts).reduce((x,y)=>x+y,0),p=paperOf(timer.p).short;
      if(tot>=0.02)for(const d in parts)addHours(d,timer.p,Math.round(parts[d]*100)/100);
      timer=null;store.del(TK);save();render();
      toast(capped?`Logged the 12-hour maximum to ${p}. If the timer was left running, correct it in Hours.`:tot>=0.02?`Logged ${Math.round(tot*60)} min to ${p}${Object.keys(parts).length>1?", split across midnight":""}`:"Too short to log");return}
    if(a==="delmock"){S.mocks=S.mocks.filter(m=>m.id!==b.dataset.id);if(mockEdit===b.dataset.id)mockEdit=null;save();render();return}
    if(a==="editmock"){mockEdit=b.dataset.id;render();const f=document.getElementById("mockForm");if(f)f.scrollIntoView({block:"center"});return}
    if(a==="mockcancel"){mockEdit=null;render();return}
    if(a==="dismissNotice"){notice("");return}
  }
});
document.addEventListener("change",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;if(evChange(b))return;if(bkChange(b))return;const a=b.dataset.act;
  if(a==="stage"){const cl=setStage(b.dataset.k,b.dataset.s,b.checked);save();render();if(cl.length)toast("Later stages were cleared too: "+cl.map(x=>STAGES.find(y=>y[0]===x)[1]).join(", "))}
  if(a==="todo"){S.todos[todayISO()][+b.dataset.i].done=b.checked;save();render()}
  if(a==="jpaper"){const pid=b.value;jPrefill={p:pid,cid:""};const sel=document.getElementById("jCh");if(sel)sel.innerHTML='<option value="">General</option>'+CH[pid].map(c=>`<option value="${c[3]}">${esc(c[0].length>60?c[0].slice(0,58)+"…":c[0])}</option>`).join("");return}
  if(a==="jclick"){const e=J.find(x=>x.id===b.dataset.id);if(e){e.clicked=b.value;jPut(e)}return}
  if(a==="fill"){const dd=defaultDates(b.value);for(const k in dd){const el=document.getElementById("ex-"+k);if(el)el.value=dd[k]}return}
  if(a==="board"){S.settings.onBoard=b.checked;save();pushBoard();render();return}
  if(a==="share"){S.settings.share=Object.assign({},S.settings.share,{[b.dataset.k]:b.checked});save();pushBoard();render();return}
  if(a==="col"){S.settings.cols=Object.assign({},S.settings.cols,{[b.dataset.k]:b.checked});save();render();return}
  if(a==="check"){S.checks[b.dataset.k]=b.checked;save();render()}
  if(a==="note"){const k=b.dataset.k;S.ch[k]=Object.assign({},S.ch[k],{note:b.value});save()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target.id,v=id=>document.getElementById(id).value;
  if(f==="todoForm"){const t=v("todoIn").trim();if(!t)return;const d=todayISO();(S.todos[d]=S.todos[d]||[]).push({t,done:false});save();render();document.getElementById("todoIn").focus()}
  if(f==="mockForm"){const sc=parseFloat(v("mScore")),mx=parseFloat(v("mMax")),d=v("mDate");
    if(!(mx>0)){toast("Enter the total marks for this mock");return}if(isNaN(sc)||sc<0||sc>mx){toast("Enter marks between 0 and "+mx);return}if(!d||d>todayISO()){toast("Pick the date you wrote it (not a future date)");return}
    const rec={paper:v("mPaper"),date:d,score:sc,max:mx,src:v("mSrc").trim()};mockForm.paper=rec.paper;
    const ex=mockEdit&&S.mocks.find(m=>m.id===mockEdit);if(ex){Object.assign(ex,rec);mockEdit=null;toast("Score updated")}else{S.mocks.push(Object.assign({id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)},rec));toast("Score saved")}
    save();render();return}
  if(f==="logForm"){const d=v("lDate"),h=parseFloat(v("lHrs"));if(!d||isNaN(h)||h<0){toast("Pick a date and enter hours");return}if(d>todayISO()){toast("Hours can't be logged for a future date");return}const capped=addHours(d,v("lPaper"),h,v("lMode"));save();render();toast(capped?"Saved, capped so the day stays within 24 hours":"Hours saved")}
  if(f==="jForm"){const t=v("jT").trim();if(!t){toast("Enter the topic");return}const e={id:"j"+Date.now().toString(36),p:v("jP"),cid:v("jCh")||null,topic:t,kind:v("jK"),why:v("jW").trim(),created:todayISO(),box:0,due:iso(addDays(new Date(),1)),reviews:[],mastered:false,clicked:"",card:null};jPrefill={p:e.p,cid:""};jPut(e);jOpen=e.id;jFilter="active";render();toast("Added. First review tomorrow.");return}
  if(f==="examForm"){const dd={};for(const p of PAPERS){const x=v("ex-"+p.id);if(!x){toast("Enter a date for "+p.short);return}dd[p.id]=x}
    const ds=Object.values(dd).sort();if(diffDays(parse(ds[0]),parse(ds[ds.length-1]))>31){toast("All papers should fall within one exam window (31 days)");return}
    S.settings.examDates=dd;save();
    const warnStart=S.settings.startDate>=ds[0]?" Your plan start date is now after the first paper, so update it below.":"";
    if(examDoc&&amOwner){examDoc.set({dates:dd,t:Date.now()}).then(()=>toast("Exam schedule saved for everyone."+warnStart),()=>toast("Saved for you only. The shared save failed."))}else toast("Exam schedule saved."+warnStart);
    render();return}
  if(f==="setForm"){const st=v("sStart"),ex=examStart();if(!st||st>=ex){toast("Start date must be before your first paper ("+fmt(ex)+")");return}Object.assign(S.settings,{startDate:st,frDone:document.getElementById("sFr").checked,groups:v("sGroups"),tWd:+v("sWd")||0,tWe:+v("sWe")||0,revDays:+v("sRev")||21,targetPct:+v("sPct")||75});save();render();toast("Settings saved")}
});

if(window.claude&&claude.use)claude.use("downloads").then(d=>{downloadsNs=d;if(d&&view==="setup")render()}).catch(()=>{});
route();
inkTo(false);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>inkTo(false));
initSync();
swipeHint();
</script>
