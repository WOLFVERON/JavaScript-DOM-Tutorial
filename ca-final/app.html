<style>
/* Layout: a ledger-style study desk. Sticky header with countdown, tab rail, one working view at a time. */
:root{
  --bg:#f3f6f4; --surface:#ffffff; --sunk:#e8eeea; --line:#d3ddd7; --fg:#15211c; --muted:#5b6b64;
  --accent:#0d6b55; --accent-soft:#d6ece4; --accent-fg:#ffffff;
  --good:#1f8a4c; --warn:#b26b00; --bad:#b3261e;
  --p1:#0d6b55; --p2:#2f5fb3; --p3:#8a4fbf; --p4:#c0562a; --p5:#b08900; --p6:#3b8c9c;
  --h0:#e3e9e5; --h1:#b9dccd; --h2:#7fbfa5; --h3:#3c9a78; --h4:#0d6b55;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2622; --line:#2a3833; --fg:#e4ece8; --muted:#93a59d;
  --accent:#4cc39c; --accent-soft:#183a30; --accent-fg:#06150f;
  --good:#5ccf8a; --warn:#e3a33b; --bad:#f07167;
  --p1:#4cc39c; --p2:#7aa5f0; --p3:#c193ec; --p4:#f08a5d; --p5:#e2c04a; --p6:#6cc6d6;
  --h0:#1c2622; --h1:#1d4436; --h2:#22684f; --h3:#2f9470; --h4:#4cc39c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412; --surface:#151d1a; --sunk:#1c2622; --line:#2a3833; --fg:#e4ece8; --muted:#93a59d;
  --accent:#4cc39c; --accent-soft:#183a30; --accent-fg:#06150f;
  --good:#5ccf8a; --warn:#e3a33b; --bad:#f07167;
  --p1:#4cc39c; --p2:#7aa5f0; --p3:#c193ec; --p4:#f08a5d; --p5:#e2c04a; --p6:#6cc6d6;
  --h0:#1c2622; --h1:#1d4436; --h2:#22684f; --h3:#2f9470; --h4:#4cc39c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.35rem}
.brand .tag{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:8px;font-family:var(--mono)}
.count b{font-size:1.5rem;color:var(--accent)}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--good)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a.on{color:var(--accent)}
main{padding-block:20px 60px}
section.view{display:grid;gap:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.card.hero{border-left:4px solid var(--accent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.paperline{display:grid;grid-template-columns:5.5rem 1fr 3.2rem;gap:10px;align-items:center}
.paperline .k{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--fg);border:1px solid var(--line)}
.chip.A{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{color:var(--warn)}
.chip.bad{color:var(--bad)}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
button,.btn{font:inherit;font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:4px 8px}
button.danger{color:var(--bad)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
textarea{width:100%;font-family:var(--mono);font-size:.8rem}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td.c,th.c{text-align:center}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.conf{display:inline-flex;gap:3px}
.conf button{width:16px;height:16px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:transparent}
.conf button.on{background:var(--accent);border-color:var(--accent)}
.note{width:100%;font-size:.8rem}
.ch-name{min-width:220px}
.ch-name small{display:block;color:var(--muted);font-size:.75rem}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.list li.done span{color:var(--muted);text-decoration:line-through}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.quick .q{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.quick .q b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gantt{display:grid;gap:6px}
.grow{display:grid;grid-template-columns:9rem 1fr;gap:10px;align-items:center}
.gtrack{position:relative;height:26px;background:var(--sunk);border-radius:6px}
.gseg{position:absolute;top:0;bottom:0;border-radius:6px;display:flex;align-items:center;padding:0 6px;font-size:.7rem;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap}
.gnow{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.phase{border-left:3px solid var(--accent);padding-left:12px;display:grid;gap:4px}
.phase.cur{border-left-color:var(--bad)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.today{outline:1.5px solid var(--fg)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.prose{max-width:70ch;display:grid;gap:10px}
.prose ul{margin:0;padding-left:1.2rem;display:grid;gap:6px}
.prose p{margin:0}
details.pw{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 16px}
details.pw summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem}
details.pw[open] summary{margin-bottom:10px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--bad);border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
@media (max-width:560px){.paperline{grid-template-columns:4.5rem 1fr 2.8rem}.grow{grid-template-columns:5.5rem 1fr}.count b{font-size:1.25rem}}
html{overflow-x:hidden}
.lossrow{display:grid;grid-template-columns:minmax(0,1fr) 4.5rem;gap:2px 10px;align-items:center;font-size:.84rem}
.lossrow .mini{grid-column:1/-1;height:7px}
.lossrow .num{text-align:right}
.mxpanel{display:grid;gap:10px;padding:12px;background:var(--sunk);border-radius:8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{display:grid;gap:2px;align-content:start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none;color:inherit;min-width:0}
a.tile:hover{border-color:var(--accent)}
.tile b{font-family:var(--mono);font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.15}
.tile .sub{font-size:.75rem;color:var(--muted)}
.pri,.warn-i{display:grid;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.pri:first-of-type,.warn-i:first-of-type{border-top:none;padding-top:0}
.kind{font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.sev3{color:var(--bad)}.sev2{color:var(--warn)}.sev1{color:var(--muted)}
.mini{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden;min-width:48px}.mini i{display:block;height:100%;background:var(--accent)}
td.rd{min-width:150px}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-size:.82rem}
.calc .num{text-align:right}
.notice{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem}
.notice.warn{border-color:var(--warn)}.notice.bad{border-color:var(--bad)}
.road{position:relative;height:18px;background:var(--sunk);border-radius:99px;overflow:visible}
.road .time{position:absolute;inset:0 auto 0 0;border-radius:99px;background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px)}
.road .done{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.road .planm{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg);opacity:.55}
.road .you{position:absolute;top:50%;width:22px;height:22px;margin-left:-11px;transform:translateY(-50%);border-radius:50%;background:var(--surface);border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.dots{display:grid;grid-template-columns:repeat(28,1fr);gap:3px}
.dots i{aspect-ratio:1;border-radius:3px;background:var(--h0);display:block;max-width:100%}
.dots i.part{background:var(--h2)}.dots i.full{background:var(--h4)}.dots i.fut{opacity:.35}
.ms{display:grid;grid-template-columns:1fr 3.5rem;gap:4px 10px;align-items:center}
.lvl{display:inline-grid;place-items:center;min-width:2.2rem;height:2.2rem;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-family:var(--mono);font-weight:500}
main{touch-action:pan-y pinch-zoom;will-change:transform}
nav.tabs{position:relative}
#tabInk{position:absolute;bottom:0;left:0;height:2px;width:0;background:var(--accent);border-radius:2px;transition:transform .32s cubic-bezier(.2,.85,.25,1),width .32s cubic-bezier(.2,.85,.25,1);pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}

/* ============ ADAPTIVE REVISION ============
   Each topic has its own interval. Good/Easy stretch it by the topic's ease; Hard and Forgot shrink it and
   lower the ease. Important (priority A) and often-forgotten topics come back sooner, and intervals are
   squeezed so every topic gets reviewed before its paper. */
const RATE_VAL={forgot:0,hard:.5,good:1,easy:1};
function schedule(e,r){const t=parse(todayISO());let ease=e.ease||2.3,ivl=e.ivl||0,reps=e.reps||0,lapses=e.lapses||0;
  const elapsed=e.lastRev?Math.max(0,diffDays(parse(e.lastRev),t)):ivl;
  if(r==="forgot"){lapses++;reps=0;ivl=1;ease=Math.max(1.3,ease-.2)}
  else if(r==="hard"){ease=Math.max(1.3,ease-.15);ivl=Math.max(1,Math.round(Math.max(ivl,1)*1.2));reps++}
  else if(r==="good"){ivl=reps===0?1:reps===1?3:Math.round(Math.max(ivl,elapsed)*ease);reps++}
  else{ease=Math.min(2.8,ease+.15);ivl=reps===0?3:Math.round(Math.max(ivl,elapsed,1)*ease*1.3);reps++}
  const row=chRow(e.cid),pri=row?row[1]:"B";ivl=Math.max(1,Math.round(ivl*(pri==="A"?.85:pri==="C"?1.15:1)*(lapses>=2?.8:1)));
  const ex=examDates()[e.p];if(ex){const left=diffDays(t,parse(ex));if(left>2)ivl=Math.min(ivl,Math.max(1,Math.floor(left/2)))}
  ivl=Math.min(ivl,120);
  Object.assign(e,{ease:Math.round(ease*100)/100,ivl,reps,lapses,lastRev:todayISO(),due:iso(addDays(t,ivl))});
  e.reviews=(e.reviews||[]).concat([{d:todayISO(),r}]).slice(-60);e.mastered=mastery(e).mastered;return ivl}
function previewIvl(e,r){return schedule(JSON.parse(JSON.stringify(e)),r)}
/* mastery 0–100: needs proof of solving questions, not just repeated reading */
const MASTERY_PARTS=[["recall","Recall consistency",30],["stability","Stability over attempts",15],["solve","Solving questions unaided",20],["unfamiliar","Applying it to unfamiliar questions",20],["concept","Conceptual understanding",15]];
function mastery(e){const rv=(e.reviews||[]).slice(-6),W=[1,1,1.5,1.5,2,2].slice(-rv.length||6);
  const recall=rv.length?rv.reduce((a,r,i)=>a+(RATE_VAL[r.r]||0)*W[i],0)/W.slice(0,rv.length).reduce((a,b)=>a+b,0):0;
  const stability=Math.min(1,(e.ivl||0)/21)*((e.lapses||0)?Math.max(.3,1-(e.lapses||0)*.15):1);
  const apps=(e.apps||[]).slice(-6),okN=apps.filter(a=>a.ok).length,solve=apps.length?okN/apps.length:0;
  const nw=apps.filter(a=>a.type==="new"),unfamiliar=nw.length?nw.filter(a=>a.ok).length/nw.length:0;
  const since=iso(addDays(new Date(),-60)),conceptMist=!!e.cid&&S.mocks.some(m=>m.date>=since&&(m.mistakes||[]).some(x=>x.cid===e.cid&&x.cat==="concept"));
  const concept=((e.clicked||"").trim().length>=20?.6:0)+(conceptMist?0:.4);
  const parts={recall,stability,solve,unfamiliar,concept};const score=Math.round(MASTERY_PARTS.reduce((a,[k,,w])=>a+parts[k]*w,0));
  const last=rv[rv.length-1];
  const mastered=score>=80&&okN>=1&&(e.reviews||[]).length>=4&&(e.ivl||0)>=21&&!(last&&last.r==="forgot");
  return {score,parts,mastered,conceptMist,need:[score<80?"score of 80+":"",okN<1?"one question solved unaided":"",(e.reviews||[]).length<4?`${4-(e.reviews||[]).length} more review${(e.reviews||[]).length===3?"":"s"}`:"",(e.ivl||0)<21?"an interval of 3+ weeks":""].filter(Boolean)}}
function recordApp(e,type,ok){e.apps=(e.apps||[]).concat([{d:todayISO(),type,ok}]).slice(-20);e.mastered=mastery(e).mastered;jPut(e)}
function topicPriority(e){const t=todayISO(),over=e.due<t?Math.min(30,diffDays(parse(e.due),parse(t))):0,row=chRow(e.cid);return over+({A:6,B:3,C:1}[row?row[1]:"B"])+(e.lapses||0)*3+(100-mastery(e).score)/10}

function tsSuggestions(){const D=S.tsDismiss||{},out=[],activeC=new Set(J.filter(e=>!e.mastered&&e.cid).map(e=>e.cid)),pair=new Set(J.filter(e=>!e.mastered).map(e=>e.cid+"|"+(e.cat||"")));
  repeatedMistakes(mocksIn("all")).forEach(r=>{const k="rep|"+r.cid+"|"+r.cat;if(D[k]||pair.has(r.cid+"|"+r.cat))return;const ch=chRow(r.cid);
    out.push({key:k,src:"repeated",p:r.paper,cid:r.cid,cat:r.cat,kind:"Repeated mistake",topic:`${CAT[r.cat].label}: ${ch?ch[0]:"chapter"}`,why:`Same mistake in ${r.n} mocks, ${r.lost} marks lost.`,score:90+r.n})});
  const repK=new Set(repeatedMistakes(mocksIn("all")).map(o=>o.cid+"|"+o.cat));

    out.push({key:k,src:"mock",p:m.paper,cid:x.cid,cat:x.cat,mock:m.id,mx:x.id,kind:"Mock mistake",topic:`${m.num||"Mock"} Q${x.q||"?"}: ${CAT[x.cat].label}${x.note?" · "+x.note:""}`.slice(0,140),why:`${x.lost} marks lost on ${fmtShort(parse(m.date))}.`,score:70+(+x.lost||0)})}));

/* ============ MOCK ANALYTICS ============
   Mistake categories map to the six skills and to how recoverable the marks are. The recovery rates are
   stated assumptions shown on screen, not predictions. */
const MISTAKE_CATS=[
  ["concept","Conceptual error","concept","concept"],
  ["provision","Incorrect provision or standard","recall","practice"],
  ["calc","Calculation mistake","calc","easy"],
  ["formula","Formula mistake","recall","practice"],
  ["misread","Misread the question","application","easy"],
  ["incomplete","Incomplete answer","application","practice"],
  ["presentation","Presentation weakness","presentation","easy"],
  ["time","Time-management problem","time","practice"],
  ["recall","Recall failure","recall","practice"],
  ["unclassified","Not classified yet",null,null]];
const CAT=Object.fromEntries(MISTAKE_CATS.map(c=>[c[0],{label:c[1],dim:c[2],bucket:c[3]}]));
const DIMS=[["concept","Conceptual understanding"],["application","Application of concepts"],["calc","Calculation accuracy"],["presentation","Answer presentation"],["time","Time management"],["recall","Recall of provisions, standards and formulas"]];
const RECOVER={easy:{rate:.8,label:"Easily recoverable",note:"Calculation slips, misread questions and presentation: checking work, reading each question twice and fixed answer formats remove most of these."},
  practice:{rate:.5,label:"Needs more practice",note:"Formulas, provisions, recall, incomplete answers, timing and unattempted questions improve with spaced revision and timed practice, so about half comes back by the next mock."},
  concept:{rate:.3,label:"Needs conceptual work",note:"Conceptual gaps need re-learning, so only about a third is realistic by the next mock."}};
const DIFF=["Easy","Moderate","Hard"];
function mockLost(m){const out={byCat:{},byDim:{},byBucket:{easy:0,practice:0,concept:0},mist:0,unatt:+m.unattMarks||0};
  (m.mistakes||[]).forEach(x=>{const c=CAT[x.cat]||CAT.unclassified,l=+x.lost||0;out.mist+=l;out.byCat[x.cat]=(out.byCat[x.cat]||0)+l;if(c.dim)out.byDim[c.dim]=(out.byDim[c.dim]||0)+l;if(c.bucket)out.byBucket[c.bucket]+=l});
  if(out.unatt){out.byDim.time=(out.byDim.time||0)+out.unatt;out.byBucket.practice+=out.unatt}
  out.total=out.mist+out.unatt;out.unknown=Math.max(0,m.max-m.score-out.total);out.unclassified=out.byCat.unclassified||0;return out}
function recoverable(m){const L=mockLost(m),b={};let rec=0;for(const k in RECOVER){b[k]={lost:L.byBucket[k],rec:Math.round(L.byBucket[k]*RECOVER[k].rate*2)/2};rec+=b[k].rec}
  return {buckets:b,rec,projected:Math.min(m.max,m.score+rec),L}}
function mocksIn(pid){return S.mocks.filter(m=>(pid==="all"?activePapers().some(p=>p.id===m.paper):m.paper===pid)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function mockChange(m){const prev=mocksFor(m.paper).filter(x=>x.date<m.date||(x.date===m.date&&x.id<m.id)).pop();return prev?pctOf(m)-pctOf(prev):null}
function mockSummary(list){const pc=list.map(pctOf);if(!pc.length)return null;
  return {n:pc.length,avg:pc.reduce((a,b)=>a+b,0)/pc.length,best:Math.max(...pc),worst:Math.min(...pc),last3:list.slice(-3).map(pctOf),latest:list[list.length-1],change:mockChange(list[list.length-1]),
    unattAvg:list.filter(m=>m.unattMarks!=null&&m.unattMarks!=="").reduce((a,m,_,arr)=>a+(+m.unattMarks||0)/arr.length,0)}}
function lossTotals(list){const t={byCat:{},byDim:{},total:0,max:0,unatt:0};list.forEach(m=>{const L=mockLost(m);t.total+=L.total;t.max+=m.max;t.unatt+=L.unatt;
  for(const k in L.byCat)t.byCat[k]=(t.byCat[k]||0)+L.byCat[k];for(const k in L.byDim)t.byDim[k]=(t.byDim[k]||0)+L.byDim[k]});return t}
function chapterLosses(list){const map={};list.forEach(m=>(m.mistakes||[]).forEach(x=>{if(!x.cid)return;const e=map[x.cid]||(map[x.cid]={cid:x.cid,paper:m.paper,lost:0,mocks:new Set(),cats:{}});e.lost+=+x.lost||0;e.mocks.add(m.id);e.cats[x.cat]=(e.cats[x.cat]||0)+(+x.lost||0)}));
  return Object.values(map).map(e=>Object.assign(e,{n:e.mocks.size})).sort((a,b)=>b.lost-a.lost)}
function repeatedMistakes(list){const map={};list.forEach(m=>(m.mistakes||[]).forEach(x=>{if(!x.cid||x.cat==="unclassified")return;const k=x.cid+"|"+x.cat,e=map[k]||(map[k]={cid:x.cid,cat:x.cat,paper:m.paper,mocks:new Set(),lost:0});e.mocks.add(m.id);e.lost+=+x.lost||0}));
  return Object.values(map).filter(e=>e.mocks.size>=2).map(e=>Object.assign(e,{n:e.mocks.size})).sort((a,b)=>b.n-a.n||b.lost-a.lost)}

/* ============ PERFORMANCE ANALYTICS & FORECAST ============
   Progress in the past is rebuilt from each chapter's revision history (recorded since data version 2).
   The forecast projects the readiness parts to each paper's exam date; it never predicts marks or ranks. */
const PACE_DAYS=28;
function flagsAt(cid,d){const c=S.ch[cid]||{};if(!c.r&&!c.q)return {};const hist=Array.isArray(c.hist)?c.hist:[];let idx=-1,q=false;
  const curIdx=ORDERED.reduce((m,st,j)=>c[st]?j:m,-1);
  if(!hist.length){if(!c.last||c.last<=d){idx=curIdx;q=!!c.q}}
  else hist.forEach(h=>{if(h.d>d)return;const i=ORDERED.indexOf(h.s);if(i>idx)idx=i;if(h.s==="q")q=true;if(h.s==="legacy"){idx=Math.max(idx,curIdx);if(c.q)q=true}});
  const o={};ORDERED.forEach((st,j)=>{o[st]=j<=idx&&!!c[st]});o.q=q&&!!c.q;return o}
function compsAt(pid,d){let W=0,cov=0,dep=0,prac=0;CH[pid].forEach(r=>{const w=PRI_W[r[1]]||1,f=flagsAt(r[3],d);W+=w;if(f.r){cov+=w;dep+=w*(f.r3?1:f.r2?.7:f.r1?.4:0)}if(f.q)prac+=w});
  return {coverage:W?cov/W:0,depth:W?dep/W:0,practice:W?prac/W:0}}
function historyThin(pid){const since=iso(addDays(new Date(),-PACE_DAYS));let ev=0,old=0;CH[pid].forEach(r=>{(((S.ch[r[3]]||{}).hist)||[]).forEach(h=>{if(h.s==="legacy")old++;else if(h.d>=since)ev++})});return {events:ev,legacy:old}}
function linSlope(ys){const n=ys.length;if(n<2)return 0;const mx=(n-1)/2,my=ys.reduce((a,b)=>a+b,0)/n;let num=0,den=0;ys.forEach((y,i)=>{num+=(i-mx)*(y-my);den+=(i-mx)*(i-mx)});return den?num/den:0}
function mockTrend(pid){const ms=mocksFor(pid).slice(-5),pc=ms.map(pctOf);return {n:ms.length,slope:linSlope(pc),avg3:pc.length?pc.slice(-3).reduce((a,b)=>a+b,0)/Math.min(3,pc.length):null}}
const FC_MOCK_EVERY=14,FC_DAMP=.5;
function forecast(pid){const R=paperReadiness(pid),t=parse(todayISO()),ex=examDates()[pid],days=ex?Math.max(0,diffDays(t,parse(ex))):0,tp=+S.settings.targetPct||75,i=R.info;
  const now=compsAt(pid,todayISO()),past=compsAt(pid,iso(addDays(t,-PACE_DAYS))),rate={coverage:Math.max(0,(now.coverage-past.coverage)/PACE_DAYS),depth:Math.max(0,(now.depth-past.depth)/PACE_DAYS),practice:Math.max(0,(now.practice-past.practice)/PACE_DAYS)};
  const MT=mockTrend(pid),futMocks=days/FC_MOCK_EVERY;let mockProj=null;
  if(MT.n>=2)mockProj=Math.max(0,Math.min(100,MT.avg3+MT.slope*futMocks*FC_DAMP));else if(MT.n===1)mockProj=MT.avg3;
  const weakRaw=R.comp.coverage>0?R.comp.weak/R.comp.coverage:1;
  const score=c=>{let v=READY_PARTS.reduce((a,[k,,w])=>a+c[k]*w,0);if(mockProj==null)v=Math.min(v,NO_MOCK_CAP);return Math.round(v)};
  const covP=Math.min(1,R.comp.coverage+rate.coverage*days),depP=Math.min(1,i.depth+rate.depth*days);
  const pace={coverage:covP,revision:.7*depP+.3*i.freshness,practice:Math.min(1,R.comp.practice+rate.practice*days),mocks:mockProj==null?0:Math.min(1,mockProj/tp),weak:weakRaw*covP,consistency:R.comp.consistency};
  const plan={coverage:1,revision:1,practice:1,mocks:pace.mocks,weak:weakRaw,consistency:1};
  const remaining=1-R.comp.coverage,finishDays=remaining<=0?0:rate.coverage>0?Math.ceil(remaining/rate.coverage):null;
  return {pid,now:R.score,pace:score(pace),plan:score(plan),paceParts:pace,days,rate,mockProj,MT,finishDays,thin:historyThin(pid),R}}
function chapterReadiness(cid){const c=S.ch[cid]||{},t=parse(todayISO()),rd=+S.settings.revDays||21,m=CHMAP[cid];
  const read=c.r?1:0,depth=c.r3?1:c.r2?.7:c.r1?.4:0,fresh=c.r&&c.last&&diffDays(parse(c.last),t)<=rd?1:0,q=c.q?1:0,conf=c.conf?c.conf/5:(c.r?.6:0);
  const lost=mocksFor(m.p).slice(-5).reduce((a,mk)=>a+(mk.mistakes||[]).filter(x=>x.cid===cid).reduce((s2,x)=>s2+(+x.lost||0),0),0),tt=J.filter(e=>e.cid===cid&&!e.mastered).length;
  const issues=Math.min(1,lost/10+tt*.25);
  const parts={read,revision:.7*depth+.3*fresh,questions:q,confidence:conf,clean:(1-issues)*read};
  const score=Math.round(parts.read*30+parts.revision*25+parts.questions*15+parts.confidence*10+parts.clean*20);return {cid,score,parts,lost,tt,row:m.r}}
function revisionConsistency(){const t=parse(todayISO()),since=iso(addDays(t,-(PACE_DAYS-1))),days=new Set();
  J.forEach(e=>(e.reviews||[]).forEach(r=>{if(r.d>=since)days.add(r.d)}));(S.recallLog||[]).forEach(l=>{if(l.d>=since)days.add(l.d)});
  for(const k in S.ch)((S.ch[k].hist)||[]).forEach(h=>{if(h.d>=since&&/^(r1|r2|r3|rev)$/.test(h.s))days.add(h.d)});
  Object.keys(S.plan||{}).forEach(d=>{if(d>=since&&(S.plan[d].tasks||[]).some(x=>x.kind==="Revise"&&x.status==="done"))days.add(d)});
  let read=0,fresh=0;const rd=+S.settings.revDays||21;activePapers().forEach(p=>CH[p.id].forEach(r=>{const c=S.ch[r[3]]||{};if(c.r){read++;if(c.last&&diffDays(parse(c.last),t)<=rd)fresh++}}));
  return {days:days.size,of:PACE_DAYS,freshness:read?fresh/read:null,read}}
function practiceAccuracy(){const since=iso(addDays(new Date(),-(PACE_DAYS-1)));let s2=0,n=0;(S.recallLog||[]).forEach(l=>{if(l.d>=since){s2+=l.right+.5*l.partial;n+=l.n}});
  const s60=iso(addDays(new Date(),-60)),apps=J.flatMap(e=>(e.apps||[]).filter(a=>a.d>=s60));

function lossConcentration(){const recent=mocksIn("all").slice(-5),ch=chapterLosses(recent),tot=recent.reduce((a,m)=>a+(m.mistakes||[]).reduce((b,x)=>b+(+x.lost||0),0),0),top=ch.slice(0,3);

function insights(){const ps=activePapers(),F=ps.map(p=>forecast(p.id)),out=[],t=parse(todayISO()),plan=buildPlan();

function lossBars(rows,maxV,unit){return rows.map(([label,v,sub])=>`<div class="lossrow"><span>${label}${sub?` <span class="muted small">${sub}</span>`:""}</span><span class="num">${unit(v)}</span><div class="mini"><i style="width:${maxV?v/maxV*100:0}%;background:var(--warn)"></i></div></div>`).join("")}

V.playbook=()=>`
  <h2>AIR playbook</h2>
  <div class="grid g3">
    <div class="card"><div class="label">What a rank takes</div><div class="stat"><b>500+/600</b><span class="small muted">Recent AIR 1 totals have been roughly 83–86%.</span></div><p class="small" style="margin:0">Top-50 ranks usually need 70%+ aggregate in both groups together, in a single attempt. Check the current merit list on icai.org.</p></div>
    <div class="card"><div class="label">Per-paper target</div><div class="stat"><b>75–85</b><span class="small muted">FR, AFM and DT are where rankers build a lead</span></div><p class="small" style="margin:0">Audit and IDT theory reward exact ICAI wording. IBS rewards structure. A single paper under 65 makes a top rank hard.</p></div>
    <div class="card"><div class="label">Exam maths</div><div class="stat"><b>1.8 min</b><span class="small muted">per mark: 180 minutes for 100 marks</span></div><p class="small" style="margin:0">Budget about 1.6 minutes a mark so you keep 15 minutes for review. Never leave an attempted question without a conclusion.</p></div>
  </div>
  <details class="pw" open><summary>The non-negotiables</summary><div class="prose"><ul>
    <li><b>ICAI material is the syllabus.</b> Study material, RTPs, MTPs, past papers with suggested answers, and the case-scenario booklets. Coaching notes are a supplement.</li>
    <li><b>Three revisions minimum</b> before the exam. The third is from your own condensed notes and takes 2–3 days per paper.</li>
    <li><b>Write full papers.</b> At least 2–3 full 3-hour mocks per paper, written by hand at 2 pm, then self-checked strictly against ICAI answers.</li>
    <li><b>Amendments decide marks</b> in DT and IDT. Know which Finance Act and notifications apply to your attempt. DT: check whether your attempt is examined under the Income-tax Act, 1961 or the new Income-tax Act, 2025 (in force from 1 April 2026), using ICAI's applicability announcement.</li>
    <li><b>Spaced recall.</b> Revisit every chapter within 21 days of last touching it. The Today tab surfaces anything overdue.</li>
    <li><b>Protect sleep and health.</b> 7 hours of sleep. Rankers keep a steady 9–11 hours a day for months; they don't do 16-hour bursts followed by burnout.</li>
  </ul></div></details>
  <details class="pw"><summary>FR · Financial Reporting</summary><div class="prose"><ul>
    <li>Answer as an examiner reads it: state the relevant Ind AS and paragraph principle, apply it to the facts, then conclude with the journal entry or numbers.</li>
    <li>Consolidation, Ind AS 103, 109, 115 and 116 carry most of the marks. Do every RTP, MTP and PYQ question on these at least twice.</li>
    <li>Keep a “trap list”: contingent consideration, NCI measurement choice, modification accounting, ECL staging.</li>
    <li>Working notes must be numbered and referenced. Presentation marks are real.</li>
  </ul></div></details>
  <details class="pw"><summary>AFM · Advanced Financial Management</summary><div class="prose"><ul>
    <li>Make a one-page formula sheet per chapter and read it daily in the final month.</li>
    <li>Derivatives, Forex and Portfolio are the most frequent: solve every ICAI question.</li>
    <li>Write assumptions explicitly, round consistently, and finish with an advisory line (“the company should hedge using…”).</li>
    <li>Theory questions (startup finance, financial policy) are short and quick to score. Don't skip them.</li>
  </ul></div></details>
  <details class="pw"><summary>Audit · Advanced Auditing & Professional Ethics</summary><div class="prose"><ul>
    <li>Use the 4-step format: provisions (SA number and requirement), facts, analysis, conclusion.</li>
    <li>Memorise SA numbers with titles and key paragraphs. Make an SA one-pager.</li>
    <li>For ethics, quote the exact clause of Schedule I or II to the CA Act, and state whether the member is guilty.</li>
    <li>Use ICAI keywords. Practise writing, because reading alone feels like knowing.</li>
  </ul></div></details>
  <details class="pw"><summary>DT · Direct Tax & International Taxation</summary><div class="prose"><ul>
    <li>Quote section numbers where possible, as they lift theory and computational marks.</li>
    <li>PGBP, capital gains, TDS, business entities and transfer pricing need the most practice.</li>
    <li>International tax is largely theory plus treaty interpretation, and it scores well with structured answers.</li>
    <li>Keep a rates and thresholds sheet updated for your applicable Finance Act.</li>
  </ul></div></details>
  <details class="pw"><summary>IDT · GST, Customs & FTP</summary><div class="prose"><ul>
    <li>The exemption list, ITC rules and place of supply are high-yield. Revise them every week.</li>
    <li>Write computations in tabular form with a note per item: “Taxable / Exempt, reason”.</li>
    <li>Customs valuation and FTP are compact and score well. Don't leave them for the end.</li>
  </ul></div></details>
  <details class="pw"><summary>IBS · Integrated Business Solutions</summary><div class="prose"><ul>
    <li>IBS is a multidisciplinary case study paper, currently open book. Confirm the current rules for your attempt. Open book still punishes slow searching, so tab your material.</li>
    <li>Solve every ICAI case study timed. Read the requirements first, then the case.</li>
    <li>It pulls from FR, AFM, Audit, DT, IDT and SPOM Sets A and B, so your other papers' revision feeds it.</li>
    <li>Write in a decision-oriented, report style: issue, analysis, recommendation.</li>
  </ul></div></details>
  <details class="pw"><summary>A ranker's study day (template)</summary><div class="prose"><ul>
    <li><b>06:30–09:30</b> Numerical paper, deep work (FR, AFM or DT)</li>
    <li><b>09:45–12:45</b> Theory paper (Audit, IDT or law-heavy chapters)</li>
    <li><b>14:00–17:00</b> Questions and answer writing. This matches the real exam slot.</li>
    <li><b>17:30–19:30</b> Second paper continued, or a mock</li>
    <li><b>21:00–22:00</b> Revise today's notes plus anything overdue from the Today tab. Plan tomorrow's tasks.</li>
  </ul><p class="small muted">Adjust to your rhythm. The point is two papers in parallel and daily writing practice.</p></div></details>`;

const BK_FORMAT="ca-final-rank-desk";
let downloadsNs=null, bk={text:"",preview:null,err:"",withTr:true,reset:{},resetAsk:false,undoAsk:false};
function makeBackup(withTr){return {format:BK_FORMAT,version:2,created:new Date().toISOString(),state:S,journal:J,
  evals:EV.map(e=>{const c=Object.assign({},e);if(!withTr)delete c.transcript;return c})}}
function readBackup(txt){let o;try{o=JSON.parse(String(txt||"").trim())}catch(e){throw new Error("That isn't backup text. Use the whole file or the whole copied text, starting with {")}
  let state,journal=[],evals=[];
  if(o&&o.format===BK_FORMAT){if(+o.version>2)throw new Error("This backup comes from a newer version of the app.");state=o.state;journal=o.journal||[];evals=o.evals||[]}
  else if(isObj(o)&&isObj(o.settings)){state=Object.assign({},o);journal=Array.isArray(o.journal)?o.journal:[];delete state.journal}
  else throw new Error("This doesn't look like a Rank Desk backup.");
  if(!isObj(state)||!isObj(state.settings))throw new Error("The backup is missing its settings, so it can't be restored.");
  for(const k of ["ch","log","checks","todos"])if(state[k]!=null&&!isObj(state[k]))throw new Error("Part of the backup ("+k+") is damaged.");
  if(state.mocks!=null&&!Array.isArray(state.mocks))throw new Error("The mock list in the backup is damaged.");
  if(!Array.isArray(journal)||!Array.isArray(evals))throw new Error("The tough topics or evaluations in the backup are damaged.");
  state.mocks=(state.mocks||[]).filter(m=>m&&m.id&&CH[m.paper]&&isFinite(+m.score)&&+m.max>0);
  return {state:load(state),journal:journal.filter(validJ).map(migJ),evals:evals.filter(validEv),created:o.created||null}}
function backupCounts(b){return {chapters:Object.values(b.state.ch).filter(c=>c&&c.r).length,days:Object.keys(b.state.log).length,mocks:b.state.mocks.length,topics:b.journal.length,evals:b.evals.length}}
function takeRestorePoint(reason){return store.set(LS+".restorePoint",{at:Date.now(),reason,b:makeBackup(false)})}
function applyBackup(b,reason){takeRestorePoint(reason);
  S=b.state;S.updatedAt=Date.now();
  const jk=new Set(b.journal.map(e=>e.id));J.slice().forEach(e=>{if(!jk.has(e.id))jRemove(e.id)});b.journal.forEach(e=>{if(TOMB[e.id]){delete TOMB[e.id];saveTomb()}jPut(Object.assign({},e))});
  const ek=new Set(b.evals.map(e=>e.id));EV.slice().forEach(e=>{if(!ek.has(e.id))evRemove(e.id)});b.evals.forEach(e=>{if(TOMB[e.id]){delete TOMB[e.id];saveTomb()}evPut(Object.assign({},e))});
  save();render()}
const RESET_PARTS=[["progress","Syllabus progress, revision history and chapter notes"],["hours","Study hours, focus sessions and a running timer"],["mocks","Mock scores"],["evals","Evaluations"],["journal","Tough topics, review history and recall-test results"],["tasks","Daily plans and your own tasks"],["checks","Checklists"],["settings","Settings: hours, targets, squad sharing (exam dates and plan start are kept)"]];
function applyReset(parts){takeRestorePoint("Before erasing: "+parts.map(k=>RESET_PARTS.find(x=>x[0]===k)[1].split(/[,:(]/)[0].trim().toLowerCase()).join(", "));
  if(parts.includes("progress"))S.ch={};
  if(parts.includes("hours")){S.log={};S.sessions=[];timer=null;store.del(TK)}
  if(parts.includes("mocks")){S.mocks=[];mockEdit=null}
  if(parts.includes("tasks")){S.todos={};S.plan={}}
  if(parts.includes("checks"))S.checks={};
  if(parts.includes("settings")){const keep={examDates:S.settings.examDates,startDate:S.settings.startDate};S.settings=Object.assign(freshState().settings,keep)}
  if(parts.includes("journal")){J.slice().forEach(e=>jRemove(e.id));S.recall={};S.recallLog=[];S.tsDismiss={}}
  if(parts.includes("evals"))EV.slice().forEach(e=>evRemove(e.id));
  save();if(parts.includes("settings"))pushBoard();render()}

    <ul class="list small">${RESET_PARTS.map(([k,l])=>`<li><label><input type="checkbox" class="chk" data-act="rspart" data-k="${k}" ${bk.reset[k]?"checked":""}><span>${l}</span></label></li>`).join("")}</ul>

async function bkClick(b){const a=b.dataset.act;
  if(a==="bkcopy"){const txt=JSON.stringify(makeBackup(bk.withTr));const ta=document.getElementById("bkText");
    try{await navigator.clipboard.writeText(txt);toast("Backup copied. Paste it somewhere safe.")}catch(e){bk.text=txt;render();const t2=document.getElementById("bkText");if(t2){t2.value=txt;t2.select()}toast("Select all and copy the text in the box")}return true}

    else{const id="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);S.mocks.push(Object.assign({id,mistakes:[]},rec));mkOpen=id;toast("Saved. Log its mistakes below to see where the marks went.")}
    save();render();return}
  if(f==="mxForm"){const m=S.mocks.find(z=>z.id===e.target.dataset.m);if(!m)return;const lost=parseFloat(v("mxLost"));if(!(lost>0)){toast("Enter the marks lost");return}
    const L=mockLost(m),room=m.max-m.score-L.total;if(lost>room+1e-9){toast(room>0?`Only ${+room.toFixed(1)} marks are left to explain on this mock`:"Every lost mark on this mock is already explained");return}
    m.mistakes=(m.mistakes||[]).concat([{id:"x"+Date.now().toString(36),q:v("mxQ").trim(),cid:v("mxCh")||null,cat:v("mxCat"),lost,note:v("mxNote").trim()}]);save();render();toast("Mistake logged");return}
  if(f==="logForm"){const d=v("lDate"),h=parseFloat(v("lHrs"));if(!d||isNaN(h)||h<0){toast("Pick a date and enter hours");return}if(d>todayISO()){toast("Hours can't be logged for a future date");return}const capped=addHours(d,v("lPaper"),h,v("lMode"));save();render();toast(capped?"Saved, capped so the day stays within 24 hours":"Hours saved")}
  if(f==="jForm"){const t=v("jT").trim();if(!t){toast("Enter the topic");return}const e=newTopic({p:v("jP"),cid:v("jCh")||null,topic:t,kind:v("jK"),why:v("jW").trim(),src:/Practice question/.test(v("jK"))?"practice":"manual"});jPrefill={p:e.p,cid:""};jPut(e);jOpen=e.id;jFilter="active";render();toast("Added. First review tomorrow.");return}
  if(f==="examForm"){const dd={};for(const p of PAPERS){const x=v("ex-"+p.id);if(!x){toast("Enter a date for "+p.short);return}dd[p.id]=x}
    const ds=Object.values(dd).sort();if(diffDays(parse(ds[0]),parse(ds[ds.length-1]))>31){toast("All papers should fall within one exam window (31 days)");return}
    S.settings.examDates=dd;save();
    const warnStart=S.settings.startDate>=ds[0]?" Your plan start date is now after the first paper, so update it below.":"";
    if(examDoc&&amOwner){examDoc.set({dates:dd,t:Date.now()}).then(()=>toast("Exam schedule saved for everyone."+warnStart),()=>toast("Saved for you only. The shared save failed."))}else toast("Exam schedule saved."+warnStart);
    render();return}
  if(f==="setForm"){const st=v("sStart"),ex=examStart();if(!st||st>=ex){toast("Start date must be before your first paper ("+fmt(ex)+")");return}Object.assign(S.settings,{startDate:st,frDone:document.getElementById("sFr").checked,groups:v("sGroups"),tWd:+v("sWd")||0,tWe:+v("sWe")||0,revDays:+v("sRev")||21,targetPct:+v("sPct")||75});save();render();toast("Settings saved")}
});

if(window.claude&&claude.use)claude.use("sample").then(x=>{sampleNs=x;if(x)x.limits().then(l=>{sampleLimits=l;if(view==="evaluate")render()}).catch(()=>{});if(x&&(view==="journal"||view==="evaluate"))render()}).catch(()=>{});
if(window.claude&&claude.use)claude.use("downloads").then(d=>{downloadsNs=d;if(d&&view==="setup")render()}).catch(()=>{});
route();
inkTo(false);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>inkTo(false));
initSync();
swipeHint();
</script>
