<style>

}

h2{font-size:1.45rem}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}

.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

.chip.A{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.swatch{width:10px;height:10px;border-radius:3px;display:inline-block}
button,.btn{font:inherit;font-weight:600;font-size:.85rem;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

input,select,textarea{font:inherit;font-size:.9rem;padding:7px 9px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
textarea{width:100%;font-family:var(--mono);font-size:.8rem}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}

table{border-collapse:collapse;width:100%;font-size:.88rem}

.ch-name{min-width:220px}

.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:flex-start}
.list li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.list li.done span{color:var(--muted);text-decoration:line-through}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.quick .q{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.quick .q b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gantt{display:grid;gap:6px}
.grow{display:grid;grid-template-columns:9rem 1fr;gap:10px;align-items:center}

.gseg{position:absolute;top:0;bottom:0;border-radius:6px;display:flex;align-items:center;padding:0 6px;font-size:.7rem;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap}
.gnow{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad)}
.phase{border-left:3px solid var(--accent);padding-left:12px;display:grid;gap:4px}
.phase.cur{border-left-color:var(--bad)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.today{outline:1.5px solid var(--fg)}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--mono);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.prose{max-width:70ch;display:grid;gap:10px}
.prose ul{margin:0;padding-left:1.2rem;display:grid;gap:6px}
.prose p{margin:0}
details.pw{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 16px}
details.pw summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:1.05rem}
details.pw[open] summary{margin-bottom:10px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid var(--bad);border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
svg text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem}
.legend span{display:inline-flex;align-items:center;gap:5px}
@media (max-width:560px){.paperline{grid-template-columns:4.5rem 1fr 2.8rem}.grow{grid-template-columns:5.5rem 1fr}.count b{font-size:1.25rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const LS = "caFinalRankDesk.v1";
const todayISO = () => iso(new Date());
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffDays(a,b){return Math.round((parse(iso(b))-parse(iso(a)))/864e5)}
function fmt(s){const d=typeof s==="string"?parse(s):s;return d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
function fmtShort(d){return d.toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const GAP={fr:0,afm:2,audit:4,dt:6,idt:8,ibs:10};

}
let S = freshState();
function load(o){const f=freshState();const x=Object.assign(f,o);const os=o.settings||{};x.settings=Object.assign(freshState().settings,os);if(!os.examDates&&os.examDate)x.settings.examDates=defaultDates(os.examDate);delete x.settings.examDate;return x}

async function flush(){
  if(!dbRef||writing||!dirty) return;
  writing=true; dirty=false;
  const s=JSON.stringify(S); lastSent=s;
  try{await dbRef.set({s, t:S.updatedAt}); setSync(true,"Synced to your account"); pushBoard()}

  if(!window.claude||!window.claude.use) return;

    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    myId=id; userNs=user;
    try{amOwner=await user.isOwner()}catch(e){}
    examDoc=db.doc("shared/exam");
    examDoc.onSnapshot(sn=>{const d=sn.exists?sn.data():null;sharedExam=d&&d.dates?d:null;render()},()=>{});
    dbRef=db.collection("data/users/"+id).doc("state");
    const snap=await dbRef.get();
    if(snap.exists){
      const d=snap.data();
      if(d && d.s && (d.t||0)>=(S.updatedAt||0)){ S=load(JSON.parse(d.s)); try{localStorage.setItem(LS,d.s)}catch(e){} render(); }
      else { dirty=true; flush(); }
    } else if(S.updatedAt){ dirty=true; flush(); }
    setSync(true,"Synced to your account");
    dbRef.onSnapshot(sn=>{
      if(!sn.exists) return; const d=sn.data(); if(!d||!d.s||d.s===lastSent) return;
      if((d.t||0)>(S.updatedAt||0)){ S=load(JSON.parse(d.s)); lastSent=d.s; try{localStorage.setItem(LS,d.s)}catch(e){} render(); }
    },()=>setSync(false,"Offline, saved on this device"));
    boardCol=db.collection("board");
    boardCol.onSnapshot(qs=>{
      board=qs.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      if(!boardReady){boardReady=true;const mine=board.find(b=>b.id===myId);
        if(mine){const o=Object.assign({},mine);delete o.id;delete o.t;lastBoard=stable(o)}else if(!S.settings.onBoard)lastBoard="off";
        pushBoard();}
      if(view==="squad"||view==="today")render();
    },()=>{});
    if(view==="squad")render();
  }catch(e){ dbRef=null; }
}

function stable(o){if(o===null||typeof o!=="object")return JSON.stringify(o);return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}"}
function summary(){const days={};for(let i=0;i<14;i++){const k=iso(addDays(new Date(),-i));const h=hoursOn(k);if(h)days[k]=Math.round(h*100)/100}
  const lat=activePapers().map(p=>{const m=S.mocks.filter(x=>x.paper===p.id).sort((a,b)=>a.date<b.date?-1:1);return m.length?m[m.length-1].score/m[m.length-1].max*100:null}).filter(x=>x!=null);
  return {days,pct:Math.round(overall()*100),streak:streak(),mockAvg:lat.length?Math.round(lat.reduce((a,b)=>a+b,0)/lat.length):null,mocks:S.mocks.length,courses:CHECKS["Courses, SPOM & articleship"].filter(([k])=>S.checks[k]).length,tWd:+S.settings.tWd,tWe:+S.settings.tWe}}
let boardBusy=false;
async function pushBoard(){
  if(!boardCol||!myId||!boardReady||boardBusy)return; boardBusy=true;
  try{
    if(!S.settings.onBoard){if(lastBoard!=="off"){await boardCol.doc(myId).delete();lastBoard="off"}}
    else{const sm=summary(),j=stable(sm);if(j!==lastBoard){await boardCol.doc(myId).set(Object.assign(sm,{t:Date.now()}));lastBoard=j}}
    boardErr="";
  }catch(e){boardErr=(e&&e.code)||"error"}
  boardBusy=false;
}
function refreshNames(ids){if(!userNs||!ids.length)return;userNs.profiles(ids).then(ps=>{let ch=false;ids.forEach(id=>{const n=(ps[id]&&ps[id].name)||"";if(names[id]!==n){names[id]=n;ch=true}});if(ch&&view==="squad")render()}).catch(()=>{})}
function squadRows(){const now=new Date(),t=todayISO(),y=iso(addDays(now,-1));
  return board.map(b=>{const days=b.days||{};let tw=0;for(let i=0;i<7;i++){const d=addDays(now,-i);tw+=(d.getDay()===0||d.getDay()===6)?(+b.tWe||0):(+b.tWd||0)}
    const wk=weekHrs(days,now);return Object.assign({},b,{wk,tw,today:+(days[t]||0),st:(days[t]||days[y])?(b.streak||0):0})}).sort((a,b)=>b.wk-a.wk||b.pct-a.pct)}
function myRankChip(){if(!boardCol||board.length<2)return "";const r=squadRows(),i=r.findIndex(x=>x.id===myId);if(i<0)return "";return `<div class="row"><span class="chip A">Squad #${i+1} of ${r.length} this week</span><a href="#squad" class="small" style="color:var(--accent)">See the board</a></div>`}
function hitDays(n){let c=0;for(let i=0;i<n;i++){const d=addDays(new Date(),-i);const tg=dayTarget(d);if(tg>0&&hoursOn(iso(d))>=tg)c++}return c}
/* focus timer (kept on this device) */
const TK=LS+".timer"; let timer=null; try{timer=JSON.parse(localStorage.getItem(TK)||"null")}catch(e){}
function mmss(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")}
function timerHTML(){
  if(timer){return `<span class="label">Focus · ${esc(paperOf(timer.p).short)}</span><b class="num" id="tElapsed" style="font-size:1.2rem">${mmss(Date.now()-timer.start)}</b><button class="primary" data-act="tstop">Stop and log</button><button class="ghost" data-act="tcancel">Discard</button>`}
  return `<select id="tPaper" aria-label="Paper for focus timer">${activePapers().map(p=>`<option value="${p.id}">${p.short}</option>`).join("")}</select><button data-act="tstart">Start focus timer</button>`}
setInterval(()=>{const el=document.getElementById("tElapsed");if(el&&timer)el.textContent=mmss(Date.now()-timer.start)},1000);

/* ============ DERIVED ============ */
function activePapers(){const g=S.settings.groups;return PAPERS.filter(p=>g==="both"||String(p.group)===g)}
function chKey(p,i){return p+"-"+i}
function chState(p,i){return S.ch[chKey(p,i)]||{}}
function chProgress(c){return STAGES.reduce((a,[k,,w])=>a+(c[k]?w:0),0)}
function paperProgress(pid){const list=CH[pid];return list.reduce((a,_,i)=>a+chProgress(chState(pid,i)),0)/list.length}
function overall(){const ps=activePapers();return ps.reduce((a,p)=>a+paperProgress(p.id),0)/ps.length}
function hoursOn(day){const l=S.log[day]||{};return Object.values(l).reduce((a,b)=>a+(+b||0),0)}
function streak(){let n=0,d=new Date();if(hoursOn(iso(d))===0)d=addDays(d,-1);while(hoursOn(iso(d))>0){n++;d=addDays(d,-1)}return n}
function examDates(){return Object.assign({},S.settings.examDates,(sharedExam&&sharedExam.dates)||{})}
function activeDates(){const d=examDates();return activePapers().map(p=>({p,date:d[p.id]})).filter(x=>x.date).sort((a,b)=>a.date<b.date?-1:1)}
function examStart(){const a=activeDates();return a.length?a[0].date:todayISO()}
function examEnd(){const a=activeDates();return a.length?a[a.length-1].date:todayISO()}
function nextPaper(){const t=todayISO();return activeDates().find(x=>x.date>=t)||null}
function isWeekend(d){const g=d.getDay();return g===0||g===6}
function dayTarget(d){return +(isWeekend(d)?S.settings.tWe:S.settings.tWd)||0}
function targetSum(from,to){let a=0;for(let d=new Date(from);d<=to;d=addDays(d,1))a+=dayTarget(d);return a}
function hoursLeft(){const e=addDays(parse(examStart()),-1),t=parse(todayISO());const done=hoursOn(todayISO());return Math.max(0,targetSum(t,e)-Math.min(done,dayTarget(t)))}
function expectedPct(plan){const t=parse(todayISO());const base={1:[0,.55],2:[.55,.2],3:[.75,.15],4:[.9,.1]};for(const ph of plan.phases){if(t>=ph.start&&t<ph.end){const n=+ph.name.match(/Phase (\d)/)[1];const f=diffDays(ph.start,t)/Math.max(1,diffDays(ph.start,ph.end));const [b,w]=base[n];return b+w*f}}return t>=plan.exam?1:0}
function weekHrs(days,ref){let a=0;for(let i=0;i<7;i++)a+=+(days[iso(addDays(ref,-i))]||0);return a}
function paperOf(id){return PAPERS.find(p=>p.id===id)}
function col(p){return `var(${paperOf(p).color})`}

/* Timeline generator */
function buildPlan(){
  const st=S.settings, start=parse(st.startDate), exam=parse(examStart());
  const D=Math.max(diffDays(start,exam),1), ps=activePapers().map(p=>p.id);
  const phases=[]; let cur=start;
  const push=(name,days,desc,blocks)=>{if(days<=0)return;const end=addDays(cur,days);phases.push({name,start:cur,end,desc,blocks:blocks(cur,days)});cur=end};
  const split=(from,days,items)=>{const tw=items.reduce((a,b)=>a+b.w,0);let c=from,out=[];items.forEach((it,i)=>{let len=i===items.length-1?diffDays(c,addDays(from,days)):Math.max(1,Math.round(days*it.w/tw));const e=addDays(c,len);out.push({papers:it.papers,label:it.label,start:c,end:e});c=e});return out};
  let p4=Math.min(Math.max(21,Math.round(D*.12)),45); if(p4>D*.5)p4=Math.round(D*.5);
  const R=D-p4; let p1=D>=110?Math.round(R*.6):0; let p2=Math.round((R-p1)*(p1?.58:.6)); let p3=R-p1-p2;
  const g=st.groups;
  const firstBlocks = g==="1"?[{papers:["fr","audit"],w:1.4,label:"FR + Audit"},{papers:["afm","audit"],w:1,label:"AFM + Audit"}]
    : g==="2"?[{papers:["dt","ibs"],w:1.3,label:"DT + IBS cases"},{papers:["idt","ibs"],w:1,label:"IDT + IBS cases"}]
    : [{papers:["fr","audit"],w:1.3,label:"FR + Audit"},{papers:["dt","afm"],w:1.25,label:"DT + AFM"},{papers:["idt","ibs"],w:1,label:"IDT + IBS"}];
  push("Phase 1 · Concepts & first reading",p1,"One numerical paper paired with one theory paper. Finish ICAI study material, make your own summary notes, solve illustrations and test-your-knowledge questions. Tick Read and Qs for each chapter.",(f,d)=>split(f,d,firstBlocks));
  push("Phase 2 · Revision 1 + question practice",p2,"Paper by paper. Revise from your notes, solve every past-paper question and RTP question for each chapter, and log weak chapters (confidence 1–2).",(f,d)=>split(f,d,ps.map(id=>({papers:[id],w:paperOf(id).w,label:paperOf(id).short}))));
  push("Phase 3 · Revision 2 + mock cycle",p3,"Faster revision with full 3-hour papers. Write at least one full mock per paper per cycle under exam conditions, check against ICAI suggested answers, and fix presentation.",(f,d)=>split(f,d,ps.map(id=>({papers:[id],w:paperOf(id).w,label:paperOf(id).short}))));
  push("Phase 4 · Final revision (exam mode)",p4,"Revision 3 from notes only. Amendments, MTP / RTP, formula sheets, and SA / section lists. Sleep and timing match the exam: 2 pm to 5 pm.",(f,d)=>split(f,d,ps.map(id=>({papers:[id],w:paperOf(id).w,label:paperOf(id).short}))));
  return {phases,start,exam,D};
}
function currentBlock(plan){const t=parse(todayISO());for(const ph of plan.phases)for(const b of ph.blocks)if(t>=b.start&&t<b.end)return {ph,b};return null}

V.plan=()=>{

V.mocks=()=>{
  const ps=activePapers(), tp=+S.settings.targetPct||75;
  const stats=ps.map(p=>{const m=S.mocks.filter(x=>x.paper===p.id).sort((a,b)=>a.date<b.date?-1:1);const pct=m.map(x=>x.score/x.max*100);return {p,m,avg:pct.length?pct.reduce((a,b)=>a+b,0)/pct.length:null,best:pct.length?Math.max(...pct):null,last:pct.length?pct[pct.length-1]:null}});
  const W=640,H=220,pad=32; const all=[...S.mocks].sort((a,b)=>a.date<b.date?-1:1);
  let chart=`<p class="muted small" style="margin:0">Add a mock score to see your trend against the target line.</p>`;
  if(all.length){const d0=parse(all[0].date),d1=parse(all[all.length-1].date),span=Math.max(1,diffDays(d0,d1));const x=d=>pad+diffDays(d0,parse(d))/span*(W-pad*2),y=v=>H-pad-(v/100)*(H-pad*1.6);
    chart=`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Mock score trend">
      ${[0,40,60,80,100].map(v=>`<line x1="${pad}" x2="${W-pad/2}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pad-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("")}
      <line x1="${pad}" x2="${W-pad/2}" y1="${y(tp)}" y2="${y(tp)}" stroke="var(--bad)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-pad/2}" y="${y(tp)-5}" text-anchor="end" style="fill:var(--bad)">target ${tp}%</text>
      ${stats.map(s=>{if(!s.m.length)return"";const pts=s.m.map(m=>`${x(m.date)},${y(m.score/m.max*100)}`).join(" ");return `<polyline points="${pts}" fill="none" stroke="${col(s.p.id)}" stroke-width="2"/>${s.m.map(m=>`<circle cx="${x(m.date)}" cy="${y(m.score/m.max*100)}" r="3.5" fill="${col(s.p.id)}"/>`).join("")}`}).join("")}
      <text x="${pad}" y="${H-8}">${fmtShort(d0)}</text><text x="${W-pad/2}" y="${H-8}" text-anchor="end">${fmtShort(d1)}</text>
    </svg></div><div class="legend">${ps.map(p=>`<span><span class="swatch" style="background:${col(p.id)}"></span>${p.short}</span>`).join("")}</div>`}
  const grp=g=>{const s=stats.filter(x=>x.p.group===g&&x.last!=null);if(!s.length)return null;const tot=s.reduce((a,b)=>a+b.last,0);return {n:s.length,agg:tot/s.length,min:Math.min(...s.map(x=>x.last))}};
  const groupCard=g=>{const r=grp(g);if(!r)return"";const pass=r.min>=40&&r.agg>=50;return `<div class="stat"><span class="label">Group ${g===1?"I":"II"} (latest)</span><b>${r.agg.toFixed(1)}%</b><span class="small ${pass?"":"muted"}" style="color:${pass?"var(--good)":"var(--bad)"}">${pass?"Pass pace":"Below pass rule"} · lowest ${r.min.toFixed(0)}</span></div>`};
  return `
  <div class="row between"><h2>Mock tests</h2><span class="small muted">Target for a rank: ${tp}%+ in every paper</span></div>
  <div class="grid g2">
    <div class="card"><div class="label">Trend</div>${chart}</div>
    <div class="card"><div class="label">Add a score</div>
      <form id="mockForm" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
        <label class="f">Paper<select id="mPaper">${ps.map(p=>`<option value="${p.id}" ${mockForm.paper===p.id?"selected":""}>${p.short}</option>`).join("")}</select></label>
        <label class="f">Date<input type="date" id="mDate" value="${todayISO()}"></label>
        <label class="f">Marks<input type="number" id="mScore" min="0" max="100" step="0.5" placeholder="62" required></label>
        <label class="f">Out of<input type="number" id="mMax" value="100" min="1"></label>
        <label class="f" style="grid-column:1/-1">Source<input id="mSrc" placeholder="ICAI MTP Series I, coaching test series, PYQ May 2025…"></label>
        <button class="primary" style="grid-column:1/-1">Save score</button>
      </form>
      <div class="row" style="gap:24px">${groupCard(1)}${groupCard(2)}</div>
      <p class="small muted" style="margin:0">ICAI pass rule: at least 40 in each paper and 50% aggregate per group. 60+ in a paper earns an exemption.</p>
    </div>
  </div>
  <div class="tablewrap"><table><tr><th>Paper</th><th class="c">Mocks</th><th class="c">Average</th><th class="c">Best</th><th class="c">Latest</th><th class="c">Gap to target</th></tr>
    ${stats.map(s=>`<tr><td><span class="row" style="gap:6px"><span class="swatch" style="background:${col(s.p.id)}"></span>${s.p.short}</span></td><td class="c num">${s.m.length}</td><td class="c num">${s.avg==null?"–":s.avg.toFixed(1)}</td><td class="c num">${s.best==null?"–":s.best.toFixed(1)}</td><td class="c num">${s.last==null?"–":s.last.toFixed(1)}</td><td class="c num" style="color:${s.last==null?"inherit":s.last>=tp?"var(--good)":"var(--warn)"}">${s.last==null?"–":(s.last>=tp?"on target":"−"+(tp-s.last).toFixed(1))}</td></tr>`).join("")}
  </table></div>
  ${S.mocks.length?`<div class="tablewrap"><table><tr><th>Date</th><th>Paper</th><th class="c">Score</th><th>Source</th><th></th></tr>${[...S.mocks].sort((a,b)=>a.date<b.date?1:-1).map(m=>`<tr><td class="num small">${fmt(m.date)}</td><td>${paperOf(m.paper).short}</td><td class="c num">${m.score}/${m.max}</td><td class="small">${esc(m.src||"")}</td><td><button class="ghost" data-act="delmock" data-id="${m.id}" aria-label="Delete mock">×</button></td></tr>`).join("")}</table></div>`:""}`;
};

V.hours=()=>{
  const weeks=18, t=new Date(), end=addDays(t,6-((t.getDay()+6)%7)), start=addDays(end,-weeks*7+1);
  let cells="";for(let i=0;i<weeks*7;i++){const d=addDays(start,i),k=iso(d),h=hoursOn(k);const tg=dayTarget(d)||1,r=h/tg;const l=h===0?"":r<.5?"l1":r<.75?"l2":r<1?"l3":"l4";cells+=`<i class="${l} ${k===todayISO()?"today":""}" title="${fmtShort(d)}: ${h.toFixed(1)} h" style="${d>t?"opacity:.35":""}"></i>`}
  const sum=(from,to)=>{let a=0;for(let d=new Date(from);d<=to;d=addDays(d,1))a+=hoursOn(iso(d));return a};
  const wk=sum(addDays(t,-6),t), mo=sum(addDays(t,-29),t), all=Object.keys(S.log).reduce((a,k)=>a+hoursOn(k),0);
  const per=activePapers().map(p=>({p,h:Object.values(S.log).reduce((a,l)=>a+(+l[p.id]||0),0)})), mx=Math.max(1,...per.map(x=>x.h));
  const t7=targetSum(addDays(t,-6),t);
  return `
  <h2>Study hours</h2>
  <div class="grid g3">
    <div class="card"><div class="stat"><span class="label">Last 7 days</span><b>${wk.toFixed(1)} h</b><span class="small muted">target ${t7} h · ${hitDays(7)} of 7 days on target</span></div><div class="bar"><i style="width:${Math.min(100,wk/t7*100)}%"></i></div></div>
    <div class="card"><div class="stat"><span class="label">Last 30 days</span><b>${mo.toFixed(1)} h</b><span class="small muted">${(mo/30).toFixed(1)} h per day</span></div></div>
    <div class="card"><div class="stat"><span class="label">All time</span><b>${all.toFixed(0)} h</b><span class="small muted">streak ${streak()} days</span></div></div>
  </div>
  <div class="card"><div class="row between"><div class="label">Last ${weeks} weeks · share of each day's target</div><div class="legend small"><span><i class="swatch" style="background:var(--h1)"></i>&lt;50%</span><span><i class="swatch" style="background:var(--h2)"></i>50–75%</span><span><i class="swatch" style="background:var(--h3)"></i>75–99%</span><span><i class="swatch" style="background:var(--h4)"></i>target hit</span></div></div><div class="heat">${cells}</div></div>
  <div class="grid g2">
    <div class="card"><div class="label">Hours by paper</div>${per.map(x=>`<div class="paperline"><span class="k">${x.p.short}</span><div class="bar"><i style="width:${x.h/mx*100}%;background:${col(x.p.id)}"></i></div><span class="num small">${x.h.toFixed(0)}h</span></div>`).join("")}</div>
    <div class="card"><div class="label">Log a past day</div>
      <form id="logForm" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
        <label class="f">Date<input type="date" id="lDate" value="${iso(addDays(t,-1))}"></label>
        <label class="f">Paper<select id="lPaper">${activePapers().map(p=>`<option value="${p.id}">${p.short}</option>`).join("")}</select></label>
        <label class="f">Hours<input type="number" id="lHrs" step="0.5" min="0" max="16" placeholder="3"></label>
        <button class="primary" style="align-self:end">Set hours</button>
      </form>
      <p class="small muted" style="margin:0">This sets the total for that paper on that day. Use 0 to clear it.</p>
    </div>
  </div>`;

V.playbook=()=>`
  <h2>AIR playbook</h2>
  <div class="grid g3">
    <div class="card"><div class="label">What a rank takes</div><div class="stat"><b>500+/600</b><span class="small muted">Recent AIR 1 totals have been roughly 83–86%.</span></div><p class="small" style="margin:0">Top-50 ranks usually need 70%+ aggregate in both groups together, in a single attempt. Check the current merit list on icai.org.</p></div>
    <div class="card"><div class="label">Per-paper target</div><div class="stat"><b>75–85</b><span class="small muted">FR, AFM and DT are where rankers build a lead</span></div><p class="small" style="margin:0">Audit and IDT theory reward exact ICAI wording. IBS rewards structure. A single paper under 65 makes a top rank hard.</p></div>
    <div class="card"><div class="label">Exam maths</div><div class="stat"><b>1.8 min</b><span class="small muted">per mark: 180 minutes for 100 marks</span></div><p class="small" style="margin:0">Budget about 1.6 minutes a mark so you keep 15 minutes for review. Never leave an attempted question without a conclusion.</p></div>
  </div>
  <details class="pw" open><summary>The non-negotiables</summary><div class="prose"><ul>
    <li><b>ICAI material is the syllabus.</b> Study material, RTPs, MTPs, past papers with suggested answers, and the case-scenario booklets. Coaching notes are a supplement.</li>
    <li><b>Three revisions minimum</b> before the exam. The third is from your own condensed notes and takes 2–3 days per paper.</li>
    <li><b>Write full papers.</b> At least 2–3 full 3-hour mocks per paper, written by hand at 2 pm, then self-checked strictly against ICAI answers.</li>
    <li><b>Amendments decide marks</b> in DT and IDT. Know which Finance Act and notifications apply to your attempt. DT: check whether your attempt is examined under the Income-tax Act, 1961 or the new Income-tax Act, 2025 (in force from 1 April 2026), using ICAI's applicability announcement.</li>
    <li><b>Spaced recall.</b> Revisit every chapter within 21 days of last touching it. The Today tab surfaces anything overdue.</li>
    <li><b>Protect sleep and health.</b> 7 hours of sleep. Rankers keep a steady 9–11 hours a day for months; they don't do 16-hour bursts followed by burnout.</li>
  </ul></div></details>
  <details class="pw"><summary>FR · Financial Reporting</summary><div class="prose"><ul>
    <li>Answer as an examiner reads it: state the relevant Ind AS and paragraph principle, apply it to the facts, then conclude with the journal entry or numbers.</li>
    <li>Consolidation, Ind AS 103, 109, 115 and 116 carry most of the marks. Do every RTP, MTP and PYQ question on these at least twice.</li>
    <li>Keep a “trap list”: contingent consideration, NCI measurement choice, modification accounting, ECL staging.</li>
    <li>Working notes must be numbered and referenced. Presentation marks are real.</li>
  </ul></div></details>
  <details class="pw"><summary>AFM · Advanced Financial Management</summary><div class="prose"><ul>
    <li>Make a one-page formula sheet per chapter and read it daily in the final month.</li>
    <li>Derivatives, Forex and Portfolio are the most frequent: solve every ICAI question.</li>
    <li>Write assumptions explicitly, round consistently, and finish with an advisory line (“the company should hedge using…”).</li>
    <li>Theory questions (startup finance, financial policy) are short and quick to score. Don't skip them.</li>
  </ul></div></details>
  <details class="pw"><summary>Audit · Advanced Auditing & Professional Ethics</summary><div class="prose"><ul>
    <li>Use the 4-step format: provisions (SA number and requirement), facts, analysis, conclusion.</li>
    <li>Memorise SA numbers with titles and key paragraphs. Make an SA one-pager.</li>
    <li>For ethics, quote the exact clause of Schedule I or II to the CA Act, and state whether the member is guilty.</li>
    <li>Use ICAI keywords. Practise writing, because reading alone feels like knowing.</li>
  </ul></div></details>
  <details class="pw"><summary>DT · Direct Tax & International Taxation</summary><div class="prose"><ul>
    <li>Quote section numbers where possible, as they lift theory and computational marks.</li>
    <li>PGBP, capital gains, TDS, business entities and transfer pricing need the most practice.</li>
    <li>International tax is largely theory plus treaty interpretation, and it scores well with structured answers.</li>
    <li>Keep a rates and thresholds sheet updated for your applicable Finance Act.</li>
  </ul></div></details>
  <details class="pw"><summary>IDT · GST, Customs & FTP</summary><div class="prose"><ul>
    <li>The exemption list, ITC rules and place of supply are high-yield. Revise them every week.</li>
    <li>Write computations in tabular form with a note per item: “Taxable / Exempt, reason”.</li>
    <li>Customs valuation and FTP are compact and score well. Don't leave them for the end.</li>
  </ul></div></details>
  <details class="pw"><summary>IBS · Integrated Business Solutions</summary><div class="prose"><ul>
    <li>IBS is a multidisciplinary case study paper, currently open book. Confirm the current rules for your attempt. Open book still punishes slow searching, so tab your material.</li>
    <li>Solve every ICAI case study timed. Read the requirements first, then the case.</li>
    <li>It pulls from FR, AFM, Audit, DT, IDT and SPOM Sets A and B, so your other papers' revision feeds it.</li>
    <li>Write in a decision-oriented, report style: issue, analysis, recommendation.</li>
  </ul></div></details>
  <details class="pw"><summary>A ranker's study day (template)</summary><div class="prose"><ul>
    <li><b>06:30–09:30</b> Numerical paper, deep work (FR, AFM or DT)</li>
    <li><b>09:45–12:45</b> Theory paper (Audit, IDT or law-heavy chapters)</li>
    <li><b>14:00–17:00</b> Questions and answer writing. This matches the real exam slot.</li>
    <li><b>17:30–19:30</b> Second paper continued, or a mock</li>
    <li><b>21:00–22:00</b> Revise today's notes plus anything overdue from the Today tab. Plan tomorrow's tasks.</li>
  </ul><p class="small muted">Adjust to your rhythm. The point is two papers in parallel and daily writing practice.</p></div></details>`;

  const note=!examDoc?"These dates drive your countdown and timeline."
    :amOwner?"You set these dates for everyone on this page. Friends see the same schedule."
    :locked?"Set by the page owner for everyone. Ask them to change it.":"No shared schedule yet, so these dates apply only to you.";
  return `<div class="card"><div class="label">Exam schedule · one date per paper</div>
    <form id="examForm" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
      ${PAPERS.map(p=>`<label class="f"><span class="row" style="gap:6px"><span class="swatch" style="background:${col(p.id)}"></span>${esc(p.short)}</span><input type="date" id="ex-${p.id}" value="${d[p.id]||""}" ${locked?"disabled":""}></label>`).join("")}
      <label class="f">Fill from first paper<input type="date" id="exFill" data-act="fill" ${locked?"disabled":""}></label>
      ${locked?"":`<button class="primary" style="grid-column:1/-1">Save exam schedule</button>`}
    </form>
    <p class="small muted" style="margin:0">${note} "Fill from first paper" sets the usual ICAI pattern: Group I and Group II papers on alternate days. Adjust each date to the official timetable on icai.org. CA Final is held in January, May and September.</p></div>`}
V.setup=()=>`
  <h2>Setup</h2>
  <div class="grid g2">
    <div class="card"><div class="label">Your attempt</div>
      <form id="setForm" class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px">
        <label class="f">Plan start date<input type="date" id="sStart" value="${S.settings.startDate}"></label>
        <label class="f">Groups<select id="sGroups"><option value="both" ${S.settings.groups==="both"?"selected":""}>Both groups</option><option value="1" ${S.settings.groups==="1"?"selected":""}>Group I only</option><option value="2" ${S.settings.groups==="2"?"selected":""}>Group II only</option></select></label>
        <label class="f">Weekday hours (Mon–Fri)<input type="number" id="sWd" min="0" max="16" step="0.5" value="${S.settings.tWd}"></label>
        <label class="f">Weekend hours (Sat–Sun)<input type="number" id="sWe" min="0" max="16" step="0.5" value="${S.settings.tWe}"></label>
        <label class="f">Revise after (days)<input type="number" id="sRev" min="5" max="60" value="${S.settings.revDays}"></label>
        <label class="f">Target % per paper<input type="number" id="sPct" min="40" max="100" value="${S.settings.targetPct}"></label>
        <button class="primary" style="grid-column:1/-1">Save settings</button>
      </form>
    </div>
    ${examCard()}
    <div class="card"><div class="label">Backup</div>
      <p class="small" style="margin:0">Your progress syncs to your account when you open this page signed in to Claude, and is also kept on this device. Copy a backup now and then.</p>
      <div class="row"><button id="copyBk">Copy backup</button></div>
      <textarea id="bkText" rows="4" placeholder="Paste a backup here to restore it"></textarea>
      <div class="row"><button id="importBk">Restore from pasted backup</button></div>
      ${confirmReset?`<div class="confirm"><span class="small">This erases all progress, logs and mocks.</span><button class="danger" id="resetYes">Erase everything</button><button id="resetNo">Keep my data</button></div>`:`<div class="row"><button class="danger" id="resetAsk">Reset all data</button></div>`}
    </div>
  </div>`;

/* ============ RENDER & EVENTS ============ */
let view="today";
function render(){
  const tag=document.getElementById("examTag");
  const np=nextPaper(),dl=np?diffDays(new Date(),parse(np.date)):0;
  document.getElementById("daysLeft").textContent=dl>=0?dl:"0";document.getElementById("daysLbl").textContent=np?"days to "+np.p.short:"exams done";
  tag.textContent=`Exams ${fmtShort(parse(examStart()))} – ${fmt(examEnd())} · ${S.settings.groups==="both"?"both groups":"Group "+(S.settings.groups==="1"?"I":"II")}`;
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.v===view));
  const active=document.activeElement, aid=active&&active.id, pos=active&&active.selectionStart;
  document.getElementById("main").innerHTML=`<section class="view">${V[view]()}</section>`;
  if(aid){const el=document.getElementById(aid);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
function route(){const h=location.hash.replace("#","");view=V[h]?h:"today";render()}
window.addEventListener("hashchange",route);
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}
function touch(k){S.ch[k]=Object.assign({},S.ch[k],{last:todayISO()})}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(b){const a=b.dataset.act;
    if(a==="hr"){const t=todayISO();S.log[t]=S.log[t]||{};S.log[t][b.dataset.p]=Math.max(0,(+S.log[t][b.dataset.p]||0)+ +b.dataset.d);save();render();return}
    if(a==="deltodo"){S.todos[todayISO()].splice(+b.dataset.i,1);save();render();return}
    if(a==="touch"){touch(b.dataset.k);save();render();toast("Marked as revised today");return}
    if(a==="paper"){curPaper=b.dataset.p;render();return}
    if(a==="filter"){chFilter=b.dataset.f;render();return}
    if(a==="conf"){const k=b.dataset.k,n=+b.dataset.n;S.ch[k]=Object.assign({},S.ch[k]);S.ch[k].conf=S.ch[k].conf===n?0:n;touch(k);save();render();return}
    if(a==="tstart"){timer={p:document.getElementById("tPaper").value,start:Date.now()};try{localStorage.setItem(TK,JSON.stringify(timer))}catch(e){}render();return}
    if(a==="tcancel"){timer=null;try{localStorage.removeItem(TK)}catch(e){}render();toast("Timer discarded");return}
    if(a==="tstop"){const h=Math.min(12,(Date.now()-timer.start)/36e5),r=Math.round(h*100)/100,t=todayISO();if(r>=0.02){S.log[t]=S.log[t]||{};S.log[t][timer.p]=Math.round(((+S.log[t][timer.p]||0)+r)*100)/100}const p=paperOf(timer.p).short;timer=null;try{localStorage.removeItem(TK)}catch(e){}save();render();toast(r>=0.02?`Logged ${(r*60).toFixed(0)} min to ${p}`:"Too short to log");return}
    if(a==="delmock"){S.mocks=S.mocks.filter(m=>m.id!==b.dataset.id);save();render();return}
  }
  const id=e.target.id;
  if(id==="resetAsk"){confirmReset=true;render()}
  if(id==="resetNo"){confirmReset=false;render()}
  if(id==="resetYes"){const keep=S.settings;S=freshState();S.settings=keep;confirmReset=false;save();render();toast("All progress erased")}
  if(id==="copyBk"){const txt=JSON.stringify(S);const ta=document.getElementById("bkText");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast("Backup copied"),()=>{ta.value=txt;ta.select();toast("Select all and copy the text")})}else{ta.value=txt;ta.select();toast("Select all and copy the text")}}
  if(id==="importBk"){try{const o=JSON.parse(document.getElementById("bkText").value);if(!o||!o.settings)throw 0;S=load(o);save();render();toast("Backup restored")}catch(err){toast("That text isn't a valid backup. Paste the full copied text.")}}
});
document.addEventListener("change",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="stage"){const k=b.dataset.k;S.ch[k]=Object.assign({},S.ch[k],{[b.dataset.s]:b.checked});touch(k);save();render()}
  if(a==="todo"){S.todos[todayISO()][+b.dataset.i].done=b.checked;save();render()}
  if(a==="fill"){const dd=defaultDates(b.value);for(const k in dd){const el=document.getElementById("ex-"+k);if(el)el.value=dd[k]}return}
  if(a==="board"){S.settings.onBoard=b.checked;save();pushBoard();render();return}
  if(a==="check"){S.checks[b.dataset.k]=b.checked;save();render()}
  if(a==="note"){const k=b.dataset.k;S.ch[k]=Object.assign({},S.ch[k],{note:b.value});save()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target.id,v=id=>document.getElementById(id).value;
  if(f==="todoForm"){const t=v("todoIn").trim();if(!t)return;const d=todayISO();(S.todos[d]=S.todos[d]||[]).push({t,done:false});save();render();document.getElementById("todoIn").focus()}
  if(f==="mockForm"){const sc=parseFloat(v("mScore")),mx=parseFloat(v("mMax"))||100;if(isNaN(sc)||sc<0||sc>mx){toast("Enter marks between 0 and "+mx);return}mockForm.paper=v("mPaper");S.mocks.push({id:Date.now().toString(36),paper:v("mPaper"),date:v("mDate")||todayISO(),score:sc,max:mx,src:v("mSrc").trim()});save();render();toast("Score saved")}
  if(f==="logForm"){const d=v("lDate"),h=parseFloat(v("lHrs"));if(!d||isNaN(h)){toast("Pick a date and enter hours");return}S.log[d]=S.log[d]||{};S.log[d][v("lPaper")]=h;save();render();toast("Hours updated")}
  if(f==="examForm"){const dd={};for(const p of PAPERS){const x=v("ex-"+p.id);if(!x){toast("Enter a date for "+p.short);return}dd[p.id]=x}
    S.settings.examDates=dd;save();
    if(examDoc&&amOwner){examDoc.set({dates:dd,t:Date.now()}).then(()=>toast("Exam schedule saved for everyone"),()=>toast("Saved for you only. Shared save failed."))}else toast("Exam schedule saved");
    render();return}
  if(f==="setForm"){const st=v("sStart"),ex=examStart();if(!st||st>=ex){toast("Start date must be before your first paper ("+fmt(ex)+")");return}Object.assign(S.settings,{startDate:st,groups:v("sGroups"),tWd:+v("sWd")||0,tWe:+v("sWe")||0,revDays:+v("sRev")||21,targetPct:+v("sPct")||75});save();render();toast("Settings saved")}
});

route();
initSync();
</script>

</html>
